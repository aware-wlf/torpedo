<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Torpedo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: graph-paper game console. Meter rail left, pool window right, pixel button deck below. Single light look on purpose (it's a sketchbook). */
:root{
  --paper:#eef2f3; --grid:#d7dfe3; --ink:#16191b; --muted:#4b5961;
  --water:#3a93cf; --zone:#8fd4f0; --good:#2fae43; --bad:#dd3328; --warn:#f0a818; --coin:#f5c518;
  --btn:#cfd4d6; --btn-hi:#f1f3f4; --btn-lo:#8f989d; --card:#f8fafa;
  --pixel:"Silkscreen","Courier New",monospace; --body:"VT323","Courier New",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:12px 12px;
  color:var(--ink); font-family:var(--body); font-size:20px; line-height:1.15;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:grid;gap:12px}
.px{font-family:var(--pixel);text-transform:uppercase;letter-spacing:.04em}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{margin:0;font-family:var(--pixel);font-weight:700;font-size:clamp(22px,4.4vw,44px);line-height:1;letter-spacing:.01em;text-wrap:balance}
header h1 small{display:block;font-size:.42em;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:.06em}
.coins{display:flex;align-items:center;gap:8px;text-align:right}
.coins b{font-family:var(--pixel);font-size:clamp(28px,5vw,48px);font-variant-numeric:tabular-nums;line-height:1}
.coins small{font-family:var(--pixel);font-size:11px;line-height:1.2}

.board{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:start}
.meters{display:grid;gap:12px}
.tubes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-items:center}
.tube{display:grid;justify-items:center;gap:4px;font-family:var(--pixel);font-size:10px;text-align:center}
.tube .glass{position:relative;width:34px;height:128px;border:3px solid var(--ink);background:#fff;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.tube .fill{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--water);transition:height .08s linear}
.tube .fill.air{background:repeating-linear-gradient(0deg,#6fbfe8 0 6px,#5bb2df 6px 12px)}
.tube .fill.lung{background:#f19a9a}
.tube .fill.mom{background:#4a8fd1}
.tube .band{position:absolute;left:0;right:0;border-top:2px dashed var(--good);border-bottom:2px dashed var(--good);background:rgba(47,174,67,.14)}
.tube .val{font-family:var(--pixel);font-size:12px;font-variant-numeric:tabular-nums}
.tube.low .glass{border-color:var(--bad)}
.tube.low .val{color:var(--bad)}
.bar-wrap{display:grid;gap:4px}
.bar-label{font-family:var(--pixel);font-size:11px;display:flex;justify-content:space-between}
.stab{position:relative;height:22px;border:3px solid var(--ink);background:linear-gradient(90deg,var(--bad) 0 16%,var(--good) 16% 84%,var(--bad) 84%);box-shadow:3px 3px 0 var(--ink)}
.stab .mark{position:absolute;top:-6px;width:8px;height:28px;margin-left:-4px;background:#fff;border:2px solid var(--ink);left:50%}
.stab-ends{display:flex;justify-content:space-between;font-family:var(--pixel);font-size:9px;color:var(--muted)}
.hips{display:grid;grid-template-columns:24px 1fr 24px;border:3px solid var(--ink);height:28px;box-shadow:3px 3px 0 var(--ink);background:#fff}
.hips span{display:grid;place-items:center;font-size:12px;background:var(--btn)}
.hips .hv{display:grid;place-items:center;font-family:var(--pixel);font-size:12px;border-inline:3px solid var(--ink);background:linear-gradient(90deg,#8fd4f0 var(--p,50%),#e3e8ea var(--p,50%))}
.hips .hv.bad{color:var(--bad)}
.dist{font-family:var(--pixel);font-size:12px;display:flex;justify-content:space-between;border-top:2px dashed var(--btn-lo);padding-top:8px}
.dist b{font-variant-numeric:tabular-nums}

.stage-col{display:grid;gap:8px;min-width:0}
.stage{position:relative;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:#7fcbee}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.alert{position:absolute;left:50%;top:3%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-weight:700;color:var(--bad);font-size:clamp(12px,2.2vw,22px);text-shadow:2px 2px 0 #000,-1px -1px 0 #000;-webkit-text-stroke:.5px #000;white-space:nowrap;pointer-events:none}
.alert svg{width:1.4em;height:1.4em}
.alert.blink{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.toast{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-family:var(--pixel);font-size:clamp(10px,1.6vw,14px);background:var(--ink);color:#fff;padding:5px 10px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.toast.show{opacity:1}
.toast.good{background:var(--good)}
.toast.bad{background:var(--bad)}
.coach{min-height:3.2em;background:var(--card);border:3px solid var(--ink);padding:6px 10px;font-size:20px;display:flex;gap:10px;align-items:flex-start}
.coach .tag{font-family:var(--pixel);font-size:11px;background:var(--ink);color:#fff;padding:3px 6px;white-space:nowrap;margin-top:2px}
.coach .tag.warn{background:var(--bad)}
.coach p{margin:0;min-width:0}

.controls{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:stretch}
.pbtn{font-family:var(--pixel);text-transform:uppercase;color:var(--ink);background:var(--btn);border:3px solid var(--ink);box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),3px 3px 0 var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;display:grid;justify-items:center;align-content:center;gap:4px;padding:6px 4px;font-size:11px;line-height:1.1;text-align:center;position:relative}
.pbtn svg{width:30px;height:30px;shape-rendering:crispEdges}
.pbtn:active,.pbtn.down{transform:translate(2px,2px);box-shadow:inset 3px 3px 0 var(--btn-lo),inset -3px -3px 0 var(--btn-hi),1px 1px 0 var(--ink)}
.pbtn:focus-visible{outline:3px solid #1d6fd6;outline-offset:3px}
.pbtn[disabled]{opacity:.45;cursor:default}
.pbtn.ok{background:#a9e3b1}
.pbtn.hint{animation:glow .6s steps(2) infinite}
@keyframes glow{50%{background:#fff3a6}}
.guide{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.guide li{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;border:3px solid var(--ink);background:#fff;padding:8px 10px}
.guide .prob{font-family:var(--pixel);font-size:13px;color:var(--bad)}
.guide .prob small{display:block;font-family:var(--body);font-size:18px;color:var(--ink);text-transform:none;letter-spacing:0}
.guide .arrow{font-family:var(--pixel);font-size:16px}
.guide .fixb{display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-size:12px;background:var(--btn);border:3px solid var(--ink);padding:6px 8px;box-shadow:inset 2px 2px 0 var(--btn-hi),inset -2px -2px 0 var(--btn-lo)}
.guide .fixb svg{width:22px;height:22px;flex:none;shape-rendering:crispEdges}
@media (max-width:480px){.guide li{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:6px 8px}.guide .arrow{display:none}.guide .prob small{font-size:16px}.guide .fixb{font-size:10px;padding:5px 6px}.guide .fixb svg{width:18px;height:18px}}
.pbtn.no{background:#f2a9a3}
.pick-group{display:grid;gap:6px}
.picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pk{border:3px solid var(--ink);background:#8fd4f0;padding:4px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:grid;gap:3px;font-family:var(--pixel);font-size:8px;color:var(--ink)}
.pk canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.suit-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.wheel{width:200px;max-width:100%;height:auto;flex:none}
.wheel path{cursor:pointer;stroke:#16191b;stroke-width:2;transition:transform .12s}
.wheel path:hover{transform:scale(1.04)}
.wheel path[aria-checked="true"]{stroke-width:5;transform:scale(1.07)}
.wheel path:focus-visible{outline:none;stroke:#1d6fd6;stroke-width:5}
.suit-name{display:grid;gap:6px;min-width:0}
.suit-name b{font-family:var(--pixel);font-size:16px}
.suit-name small{font-size:18px;color:var(--muted)}
.pk[aria-pressed="true"]{background:#ffffff;box-shadow:0 0 0 3px var(--ink),3px 3px 0 3px var(--ink)}
.pk:focus-visible{outline:3px solid #1d6fd6;outline-offset:3px}
.name-in{font-family:var(--pixel);font-size:18px;padding:10px 12px;border:3px solid var(--ink);background:#fff;color:var(--ink);width:100%;box-shadow:inset 2px 2px 0 var(--btn-lo)}
@media (max-width:560px){.picker{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pbtn kbd{position:absolute;top:3px;right:4px;font-family:var(--pixel);font-size:9px;color:var(--muted)}
.hold{font-size:13px;min-height:112px}
.hold svg{width:40px;height:40px}
.hold .sub{font-size:9px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.pad .pbtn{min-height:112px}
.pad .grp{display:none}
.foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;font-size:18px;color:var(--muted)}
.foot .links{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{font-family:var(--pixel);font-size:11px;background:var(--card);border:2px solid var(--ink);padding:5px 8px;cursor:pointer;color:var(--ink)}
.tbtn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}

/* modal */
.modal{position:fixed;inset:0;background:rgba(22,25,27,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.card{width:min(560px,100%);background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px;display:grid;gap:14px;max-height:calc(100% - 8px);overflow-y:auto}
.card h2{margin:0;font-family:var(--pixel);font-size:24px;line-height:1.1;text-wrap:balance}
.card p{margin:0;font-size:21px;max-width:60ch}
.card .eyebrow{font-family:var(--pixel);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.cbtn{font-family:var(--pixel);font-size:13px;text-transform:uppercase;padding:12px 14px;border:3px solid var(--ink);background:var(--btn);box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),3px 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
.cbtn.go{background:#8fd4f0}
.cbtn:active{transform:translate(2px,2px)}
.breather{display:grid;place-items:center;height:190px}
.breather .sq{width:150px;height:150px;background:#8fd4f0;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font-family:var(--pixel);font-size:28px;transition:transform .1s linear;image-rendering:pixelated}
.cue{font-family:var(--pixel);font-size:18px;text-align:center}
.bigtime{font-family:var(--pixel);font-size:56px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.tank{height:18px;border:3px solid var(--ink);background:#fff;position:relative}
.tank i{position:absolute;inset:0 auto 0 0;background:#6fbfe8;width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border:3px solid var(--ink);background:#fff;padding:8px;display:grid;gap:4px}
.stat b{font-family:var(--pixel);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--pixel);font-size:9px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:19px;border-bottom:1px dashed var(--btn-lo);padding-bottom:5px}
.log .chip{font-family:var(--pixel);font-size:10px;padding:3px 6px;color:#fff;background:var(--good);white-space:nowrap;margin-top:2px}
.log .chip.meh{background:var(--warn);color:var(--ink)}
.log .chip.bad{background:var(--bad)}
.master{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;border:3px solid var(--ink);background:#fff3a6;padding:12px;box-shadow:4px 4px 0 var(--ink)}
.master svg{width:72px;height:72px}
.master b{font-family:var(--pixel);font-size:16px;display:block;margin-bottom:6px}
.master p{font-size:21px}
.tips{border:3px solid var(--ink);background:#e5f5fc;padding:10px 12px;display:grid;gap:6px}
.tips h3{margin:0;font-family:var(--pixel);font-size:13px}
.tips p{font-size:20px}

@media (max-width:760px){
  body{font-size:19px}
  .board{grid-template-columns:1fr}
  .meters{order:2;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:start}
  .tubes{gap:6px}
  .tube .glass{width:26px;height:78px}
  .tube{font-size:8px}
  .side{display:grid;gap:10px;min-width:0}
  .stage-col{order:1}
  .controls{grid-template-columns:1fr}
  .hold{min-height:64px;grid-auto-flow:column;gap:10px}
  .hold svg{width:28px;height:28px}
  .pad{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .pad .pbtn{min-height:74px;font-size:9px}
  .pad .pbtn svg{width:24px;height:24px}
  .pbtn kbd{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .coach{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.alert.blink{animation:none}.tube .fill{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <h1>Torpedo!<small>Level 1 · Push &amp; Glide<span id="swTag"></span></small></h1>
    <div class="coins"><b id="coinN">0</b><small>COINS<br>COLLECTED</small></div>
  </header>

  <div class="board">
    <aside class="meters" aria-label="Body meters">
      <div class="tubes">
        <div class="tube" id="tAir"><span>AIR<br>&nbsp;</span><div class="glass"><div class="fill air" id="fAir"></div></div><span class="val" id="vAir">--</span></div>
        <div class="tube" id="tLung"><span>LUNGS<br>&nbsp;</span><div class="glass"><div class="band" style="bottom:55%;height:20%"></div><div class="fill lung" id="fLung"></div></div><span class="val" id="vLung">0%</span></div>
        <div class="tube" id="tMom"><span>SPEED<br>&nbsp;</span><div class="glass"><div class="fill mom" id="fMom"></div></div><span class="val" id="vMom">0</span></div>
      </div>
      <div class="side">
        <div class="bar-wrap">
          <div class="bar-label"><span>BALANCE</span></div>
          <div class="stab"><div class="mark" id="stabMark"></div></div>
          <div class="stab-ends"><span>LEGS DOWN</span><span>HEAD DOWN</span></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label"><span>BOTTOM &amp; LEGS</span></div>
          <div class="hips"><span aria-hidden="true">▲</span><div class="hv" id="hipsV">just right</div><span aria-hidden="true">▼</span></div>
        </div>
        <div class="dist"><span>HOW FAR</span><b id="distV">0 m / 100 m</b></div>
      </div>
    </aside>

    <div class="stage-col">
      <div class="stage">
        <canvas id="cv" width="384" height="216" aria-label="Side view of the pool with the swimmer"></canvas>
        <div class="alert" id="alert" hidden></div>
        <div class="toast" id="toast"></div>
      </div>
      <div class="coach" id="coach"><span class="tag" id="coachTag">STEP 1</span><p id="coachText">Loading…</p></div>
    </div>
  </div>

  <div class="controls">
    <button class="pbtn hold" id="holdBtn" aria-label="Hold button">
      <span id="holdLabel">HOLD: BIG BREATH</span>
      <svg viewBox="0 0 16 16" fill="currentColor" id="holdIcon"><path d="M7 1h2v8h3v2h-2v2H9v1H7v-1H6v-2H4V9h3z M3 14h10v2H3z"/></svg>
      <span class="sub" id="holdSub">SPACE</span>
    </button>
    <div class="pad" id="pad"></div>
  </div>

  <div class="foot">
    <span>Keys: Q W E R / A S D F · hold Space</span>
    <div class="links">
      <button class="tbtn" id="guideBtn">FIX-IT GUIDE</button>
      <button class="tbtn" id="hintsBtn" aria-pressed="true">HELPER HINTS</button>
      <button class="tbtn" id="soundBtn" aria-pressed="true">SOUND</button>
      <button class="tbtn" id="breathBtn">BREATH TEST</button>
      <button class="tbtn" id="swimmerBtn">MY SWIMMER</button>
      <button class="tbtn" id="restartBtn">RESTART</button>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="card" id="card"></div></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=384,H=216,SURF=46,PXM=66,PXH=40,FLOOR=SURF+2*PXM;
const ZT=.15,ZB=.55,POOL=25,HALF=12.5,DISP=4,HEADOFF=38/PXM;
// SLOW stretches the swim in time without changing distances: a clean run to 100 m takes ~30 s of air
const SLOW=.37, SPD=3.2*SLOW;
const AIRF=l=>.6+.4*l; // share of breath-test air you get for a given breath
const mod=(a,n)=>((a%n)+n)%n, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;

const store={get(k,d){try{const v=localStorage.getItem('gg_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gg_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- body faults: what went wrong, how to fix it in the game, what to feel at the pool ---------- */
const F={
  deep:{name:'TOO DEEP!',fix:['armsUp','lift'],drag:.04,tip:'You sank too low. Raise your arms to swim back up!',pool:'Point your hands a little up, like a plane taking off.'},
  surface:{name:'TOO HIGH!',fix:['armsDown','bubbles','chin'],drag:.07,tip:'You are on top of the water. Drop your arms to go under a little!',pool:'Point your hands a little down so you glide just under the water.'},
  headUp:{name:'FACE TOO HIGH!',fix:['chin'],drag:.05,tip:'You are looking forward. Tuck your chin and look at the floor!',pool:'Look down at the black line on the bottom of the pool.'},
  dive:{name:'NOSE DIVE!',fix:['lift'],drag:.04,tip:'Your chin is squished down. Lift your head a tiny bit!',pool:'Pretend you hold a little ball under your chin.'},
  legDrop:{name:'LEGS SINKING!',fix:['core'],drag:.07,tip:'Your legs are falling down. Make a tight tummy!',pool:'Squeeze your tummy like a rock. Your feet float up.'},
  pike:{name:'BOTTOM UP!',fix:['relax'],drag:.05,tip:'Your bottom popped up. Make a soft tummy to get flat!',pool:'Be long and straight like a pencil.'},
  legsCross:{name:'LEGS CROSSING!',fix:['legs'],drag:.07,tip:'Your legs are wiggling apart. Squeeze your legs together!',pool:'Stick your big toes together like glue.'},
};
const ACTIONS=[
  {id:'armsUp',label:'Raise Arms',key:'q',icon:'<path d="M7 1h2v2h2v2h2v2H9v8H7V7H3V5h2V3h2z"/>'},
  {id:'chin',label:'Chin Tuck',key:'w',icon:'<path d="M1 2h8v8H1z M11 5h2v6h2v2h-1v1h-1v1h-2v-1h-1v-1H9v-2h2z"/><path fill="#16191b" d="M5 7h3v1H5z"/>'},
  {id:'core',label:'Tight Tummy',key:'e',icon:'<path d="M6 2h4v12H6z M0 7h3V5h1v2h1v2H4v2H3V9H0z M16 7h-3V5h-1v2h-1v2h1v2h1V9h3z"/>'},
  {id:'legs',label:'Squeeze Legs',key:'r',icon:'<path d="M3 1h3v6h1v8H5V9H4V8H3z M13 1h-3v6H9v8h2V9h1V8h1z"/>'},

  {id:'lift',label:'Lift Head',key:'s',icon:'<path d="M1 6h8v8H1z M11 1h2v1h1v1h1v2h-2v6h-2V5H9V3h1V2h1z"/><path fill="#16191b" d="M6 8h2v1H6z"/>'},

function beep(f,d=.08,type='square',vol=.05,slide=0){
  if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,AC.currentTime+d);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

/* ---------- hold button (breathe in / sink & push) ---------- */
const holdBtn=$('#holdBtn');
function holdStart(){
  if(paused||holding)return;holding=true;holdBtn.classList.add('down');

  else if(R.phase==='sink'){R.sinking=true;beep(260,.2,'sine',.04,-120)}
  else if(R.phase==='glide'){if(R.pullReady)doPull();else if(!R.pulled)toast('GLIDE TO 50 M FIRST!')}
}
function doPull(){
  const r=R;r.pulled=true;r.pullReady=false;r.pullT=.5;r.pullX=r.x+1.25;r.mom=Math.min(1,r.mom+.6);
  for(let i=0;i<14;i++)r.bubbles.push({x:r.x+.3+Math.random()*.6,d:r.d+.05,v:.3+Math.random()*.6,s:Math.random()*6});
  beep(200,.35,'sawtooth',.05,700);toast('PULL! ZOOM!','good');setHold();coach();
}
function holdEnd(){

}

function setHold(){

}

function lockLungs(){
  R.filling=false;R.lung=Math.max(.12,R.lung);

function launch(){
  R.sinking=false;

  if(hd<ZT){q=.55+.35*(hd/ZT);msg=hd<.04?'TOO HIGH':'A LITTLE HIGH'}
  else if(hd<=ZB){q=1;msg='SUPER PUSH!'}
  else{q=Math.max(.5,1-(hd-ZB)*.7);msg='TOO DEEP'}
  R.pushQ=q;R.pushMsg=msg;R.msgT=1.8;R.mom=q;R.d0=R.d;R.dT=Math.max(.06,hd+.04);R.lt=0;R.phase='launch';setHold();
  beep(q===1?880:520,.18,'square',.05,q===1?300:0);

}

/* ---------- body actions ---------- */
function act(a){
  if(paused)return;
  const b=$('#b_'+a);
  if(R.phase!=='glide'){flashBtn(b,'');if(R.phase==='ready'||R.phase==='sink')toast('FIRST: '+(R.phase==='ready'?'BIG BREATH IN':'SINK & PUSH'));return}
  const open=Object.keys(R.open);
  const right=open.filter(id=>F[id].fix.includes(a));
  switch(a){
    case 'armsUp':R.arms=1;R.armT=1.3;break;
    case 'armsDown':R.arms=-1;R.armT=1.3;break;
    case 'chin':R.head=Math.max(-1,R.head-1);break;
    case 'lift':R.head=Math.min(1,R.head+1);break;
    case 'core':R.hips=Math.min(1,R.hips+.3);R.coreT=2.5;break;
    case 'relax':R.hips=Math.max(-1,R.hips-.3);R.coreT=0;break;
    case 'legs':R.legs=0;break;
    case 'bubbles':R.bub++;R.lung=Math.max(.15,R.lung-.07);R.air=Math.max(0,R.air-.4);
      for(let i=0;i<6;i++)R.bubbles.push({x:R.x+.95+Math.random()*.15,d:R.d-.05,v:.5+Math.random()*.5,s:Math.random()*6});
      beep(900+Math.random()*300,.05,'sine',.03);
      if(R.lung<.3)toast('ALMOST NO AIR LEFT IN YOUR TUMMY!','bad');
      break;
  }
  if(right.length){right.forEach(id=>R.open[id].by=a);flashBtn(b,'ok');}
  else if(open.length&&a!=='bubbles'){open.forEach(id=>R.open[id].wrong.push(a));R.wrongCount++;flashBtn(b,'no');toast('OOPS! TRY ANOTHER BUTTON','bad');beep(140,.12,'sawtooth',.04)}
  else flashBtn(b,'');
}
function flashBtn(b,c){if(!b)return;b.classList.remove('ok','no');if(c){b.classList.add(c);setTimeout(()=>b.classList.remove(c),260)}}

/* ---------- fault detection with a little hysteresis ---------- */
function faultList(r){
  const f=[];
  if(r.head>0)f.push('headUp');if(r.head<0)f.push('dive');
  if(r.hips<-.3)f.push('legDrop');if(r.hips>.35)f.push('pike');
  if(r.legs)f.push('legsCross');
  if(r.d<(r.open.surface?.13:.09))f.push('surface');
  if(r.d>(r.open.deep?.78:.86))f.push('deep');
  return f;
}
const EVENTS=[
  {w:3,ok:r=>r.head===0,go:r=>r.head=1},
  {w:1.4,ok:r=>r.head===0&&r.d<.6,go:r=>r.head=-1},
  {w:2.5,ok:r=>r.d<.6,go:r=>{r.vD=.9}},
  {w:2,ok:r=>r.d>.2,go:r=>{r.vD=-.9}},
  {w:3,ok:r=>r.hips>-.2,go:r=>r.hips=Math.min(r.hips,-.55)},
  {w:1.2,ok:r=>r.hips<.2,go:r=>r.hips=.6},
  {w:2.5,ok:r=>!r.legs,go:r=>r.legs=1},
];
function fireEvent(r){
  const pool=EVENTS.filter(e=>e.ok(r));if(!pool.length)return;
  let tot=pool.reduce((s,e)=>s+e.w,0),x=Math.random()*tot;
  for(const e of pool){x-=e.w;if(x<=0){e.go(r);return}}
}

/* ---------- update ---------- */
function update(dt){
  const r=R;r.clock+=dt;if(r.msgT>0)r.msgT-=dt;
  r.bubbles.forEach(b=>{b.d-=b.v*dt;b.x+=Math.sin(b.d*18+b.s)*.12*dt});r.bubbles=r.bubbles.filter(b=>b.d>0);
  r.sparks.forEach(s=>{s.t-=dt;s.y-=12*dt});r.confetti.forEach(c=>{c.y+=c.v*dt;c.x+=Math.sin(c.y*.1+c.w)*.4});r.sparks=r.sparks.filter(s=>s.t>0);

  if(r.phase==='ready'){
    if(r.filling)r.lung=Math.min(1,r.lung+.42*dt);
    r.d=.42-r.lung*.06+Math.sin(r.clock*2)*.01;
  }
  else if(r.phase==='sink'){
    if(r.sinking){
      r.d+=.5*dt;const hd=r.d-HEADOFF;
      if(hd>0){r.air-=dt;if(Math.random()<dt*3)r.bubbles.push({x:r.x+.05,d:r.d-HEADOFF,v:.6,s:Math.random()*6})}
      if(hd>1.25)launch();
    } else r.d=.36+Math.sin(r.clock*2)*.01;
  }
  else if(r.phase==='launch'){
    r.lt+=dt;const k=Math.min(1,r.lt/.45),e=1-Math.pow(1-k,3);
    r.rot=-Math.PI/2*(1-e);r.d=lerp(r.d0,r.dT,e);r.x+=r.mom*SPD*dt*e;r.air-=dt;
    if(k>=1){r.phase='glide';r.t=0;setHold();coach()}
  }
  else if(r.phase==='glide'){
    r.t+=dt;r.air-=dt;
    const spd=SPD*r.mom, eq=.05+(1-r.lung)*1.1, steer=r.head*.45+r.arms*.6;
    const acc=(eq-r.d)*1.4-steer*Math.min(1.1,r.mom)*1.7*.9-r.vD*2;
    r.vD+=acc*dt;r.d+=r.vD*dt;
    if(r.d<.03){r.d=.03;r.vD=Math.max(0,r.vD)}
    let floor=false;if(r.d>1.8){r.d=1.8;r.vD=Math.min(0,r.vD);floor=true}
    let drift=(.035+Math.max(0,r.lung-.55)*.5+(r.head>0?.12:0))*SLOW;
    if(r.coreT>0){r.coreT-=dt;drift*=.4}
    if(r.pullT>0)r.pullT-=dt;
    if(r.d<.12)r.tHigh+=dt;if(r.d>.8)r.tDeep+=dt;
    {const ready=r.x+1.25>=HALF&&!r.pulled;if(ready!==r.pullReady){r.pullReady=ready;setHold();if(ready){toast('50 M! PRESS PULL!','good');beep(523,.1);setTimeout(()=>beep(659,.1),100);setTimeout(()=>beep(784,.15),200)}}}
    if(r.armT>0){r.armT-=dt;if(r.armT<=0)r.arms=0}
    r.hips=clamp(r.hips-drift*dt,-1,1);
    if(r.t>=r.nextEv){const n=Object.keys(r.open).length;if(n<3)fireEvent(r);r.nextEv=r.t+(2.5+Math.random()*1.2)/SLOW}
    // faults
    const cur=faultList(r);
    cur.forEach(id=>{if(!r.open[id]){r.open[id]={t0:r.t,wrong:[],by:null};beep(200,.14,'square',.05,-60)}});
    Object.keys(r.open).forEach(id=>{if(!cur.includes(id)){const o=r.open[id];r.log.push({id,dt:r.t-o.t0,wrong:o.wrong,by:o.by,fixed:true});delete r.open[id];
      if(r.t-o.t0>.25){toast(['GREAT JOB!','YOU FIXED IT!','SUPER!','NICE!'][Math.floor(Math.random()*4)],'good');beep(660,.1,'square',.04,220)}}});
    let k=.16;cur.forEach(id=>k+=F[id].drag*2);if(floor)k+=.25;k*=SLOW;
    r.mom*=Math.exp(-k*dt);r.x+=spd*dt;
    // coins
    r.coinList.forEach(c=>{if(!c.got){const dx=c.x-r.x;if(dx>-.5&&dx<1.2&&Math.abs(c.d-r.d)<.15){c.got=true;r.coins++;r.sparks.push({x:c.x,d:c.d,y:0,t:.6});beep(1320,.07,'square',.04,400)}}});
    coach();
    if(r.x+1.25>=POOL)endRun('wall');
    else if(r.air<=0)endRun('air');
    else if(r.mom<.12)endRun('stop');
  }
  else if(r.phase==='end'){
    r.endT+=dt;r.d=lerp(r.d,.12,dt*1.5);r.rot=lerp(r.rot,-.5,dt*1.5);r.x+=r.mom*dt*Math.max(0,1-r.endT);
    if(r.endT>(r.endReason==='wall'?2:1.1)&&!r.shown){r.shown=true;showResults()}
  }
  if(r.air<0)r.air=0;
}
function endRun(reason){
  const r=R;r.phase='end';r.endReason=reason;r.endT=0;setHold();
  Object.keys(r.open).forEach(id=>{const o=r.open[id];r.log.push({id,dt:r.t-o.t0,wrong:o.wrong,by:null,fixed:false})});r.open={};
  $('#alert').hidden=true;
  if(reason==='wall')beep(523,.12),setTimeout(()=>beep(784,.2),120);else beep(330,.25,'triangle',.05,-150);
  const dist=Math.min(POOL,r.x+1.25)*DISP;if(dist>best){best=dist;store.set('best100',best)}
  if(reason==='wall'){store.set('mastered',true);setTag();const cols=['#FE2712','#FB9902','#FEFE33','#66B032','#0247FE','#8601AF'];
    for(let i=0;i<90;i++)r.confetti.push({x:Math.random()*W,y:-Math.random()*80,v:30+Math.random()*50,c:cols[i%6],w:Math.random()*6});
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.05),i*140))}
  coach();
}

/* ---------- drawing ---------- */
let C=ctx;
function rect(c,x,y,w,h){C.fillStyle=c;C.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(time){
  const r=R, camX=Math.max(-.5,r.x-3.2), off=camX*PXH;
  // sky / deck grid
  rect('#eef2f3',0,0,W,SURF);
  ctx.fillStyle='#d9e1e5';for(let gx=-mod(off,8);gx<W;gx+=8)ctx.fillRect(Math.round(gx),0,1,SURF);for(let gy=2;gy<SURF;gy+=8)ctx.fillRect(0,gy,W,1);
  // water bands
  const bands=[[0,ZT,'#86cff0'],[ZT,ZB,'#72c4ec'],[ZB,1,'#43a0da'],[1,1.5,'#338ccb'],[1.5,2,'#2b7cb9']];
  bands.forEach(([a,b,c])=>rect(c,0,SURF+a*PXM,W,Math.ceil((b-a)*PXM)));
  ctx.fillStyle='rgba(255,255,255,.08)';for(let gx=-mod(off,8);gx<W;gx+=8)ctx.fillRect(Math.round(gx),SURF,1,FLOOR-SURF);for(let gy=SURF;gy<FLOOR;gy+=8)ctx.fillRect(0,gy,W,1);

  for(let x=-mod(off,6);x<W;x+=6)rect('#16191b',x,SURF-1,3,1);
  for(let x=-mod(off*.5+time*6,12);x<W;x+=12)rect('#d8f1fb',x,SURF,4,1);
  for(let x=-mod(off,6);x<W;x+=6)rect('#e9fbff',x,SURF+ZB*PXM,3,1);
  // floor
  rect('#1f2d36',0,FLOOR,W,2);
  for(let x=-mod(off,8)-8;x<W;x+=8)for(let y=FLOOR+2;y<H;y+=8){const i=Math.round((x+off)/8)+Math.round(y/8);rect(i%2?'#9db3bf':'#8ba3b1',x,y,8,8)}
  // labels
  ctx.font='8px Silkscreen, monospace';ctx.textBaseline='top';ctx.textAlign='center';
  ctx.fillStyle='#16191b';ctx.fillText('SURFACE',W/2,SURF-11);
  ctx.fillStyle='#f7ffc2';ctx.fillText('GLIDE ZONE',W/2,SURF+ZT*PXM+(ZB-ZT)*PXM/2-4);
  ctx.fillStyle='#e6f4fb';ctx.fillText('POOL FLOOR',W/2,FLOOR-11);

  {const px=HALF*PXH-off;if(px>-40&&px<W+40){for(let y=SURF;y<FLOOR;y+=6)rect('#f5c518',px-1,y,2,3);ctx.fillStyle='#f5c518';ctx.textAlign='center';ctx.fillText('PULL!',px,SURF-11)}}
  // start wall
  const wx=-off;rect('#6f8a99',wx-14,SURF-12,14,H);for(let y=SURF-12;y<H;y+=6)rect('#5d7684',wx-14,y,14,1);rect('#48606d',wx-16,SURF-14,18,3);rect('#16191b',wx-1,SURF-12,1,H);
  // end wall (checkered)
  const ex=POOL*PXH-off;if(ex<W+10){for(let y=SURF-12,j=0;y<H;y+=5,j++)for(let i=0;i<3;i++)rect((i+j)%2?'#d3dbdf':'#6d7d86',ex+i*5,y,5,5);rect('#16191b',ex,SURF-12,1,H)}
  // push guide at the wall
  if(r.phase==='ready'||r.phase==='sink'){
    const gx=wx+30;rect('rgba(47,174,67,.35)',gx,SURF+ZT*PXM,4,(ZB-ZT)*PXM);
    rect('#2fae43',gx,SURF+ZT*PXM,8,1);rect('#2fae43',gx,SURF+ZB*PXM,8,1);
    const hy=SURF+(r.d-HEADOFF)*PXM;rect('#16191b',gx+6,hy-1,6,3);rect('#16191b',gx+5,hy,1,1);
    ctx.textAlign='left';ctx.fillStyle='#0f5d1c';ctx.fillText('PUSH',gx+14,SURF+ZT*PXM+4);ctx.fillText('ZONE',gx+14,SURF+ZT*PXM+13);
  }
  // coins
  r.coinList.forEach(c=>{if(c.got)return;const sx=c.x*PXH-off,sy=SURF+c.d*PXM;if(sx<-10||sx>W+10)return;
    const w=Math.max(1,Math.round(Math.abs(Math.sin(time*3+c.x))*4));
    rect('#8a5c00',sx-w-1,sy-5,w*2+2,10);rect('#f5c518',sx-w,sy-4,w*2,8);rect('#fff2a0',sx-w,sy-4,Math.max(1,w-1),2);if(w>2)rect('#b07a00',sx-1,sy-2,2,4)});

  // swimmer
  const sx=r.x*PXH-off, sy=SURF+r.d*PXM;

  }

const mixHex=(a,b,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(a.substr(i,2),16)*(1-t)+parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');

function drawSwimmer(x,y,a,r,lk=look,cx=ctx){

  const t=big?5:4, limb=big?4:3, arm=big?5:4;

  const pp=r.pulled?(r.pullT>0?1-r.pullT/.5:1):0, armA=pp?lerp(-.07,Math.PI-.08,pp)-(pp>=1?r.arms*.06:0):r.arms===0?-.07:r.arms>0?-.42:.42, headA=r.head===0?0:r.head>0?-.5:.42, legA=r.hips*.5;
  // back arm
  cx.save();cx.translate(24,-2);cx.rotate(armA+(r.arms<0&&!pp?.22:0));rect(skinD,0,-arm/2,24,arm);rect(skinD,24,-arm/2,4,arm);cx.restore();
  // legs
  cx.save();cx.rotate(legA);
  if(r.legs){cx.save();cx.rotate(.28);rect(skinD,-30,-limb,28,limb);rect(skinD,-33,-limb,3,limb+1);cx.restore();cx.save();cx.rotate(-.22);rect(skin,-30,0,28,limb);rect(skinD,-33,0,3,limb+1);cx.restore();}
  else{rect(skinD,-30,-limb,28,limb);rect(skin,-30,0,28,limb);rect(skinD,-33,-limb,3,limb*2)}
  cx.restore();
  // torso + suit

  if(lk.g==='f'){rect(suit,-7,-t-1,27,t*2+2);rect(suitL,-7,-t-1,27,2);rect(suit,20,-t,3,2)}
  else{rect(suit,-7,-t-1,14,t*2+2);rect(suitL,-7,-t-1,14,2)}
  // head
  cx.save();cx.translate(26,0);cx.rotate(headA);
  if(lk.g==='f'){rect(hair,-6,-8,9,3);rect(hair,-9,-7,4,2)}
  rect(skin,1,-5,11,10);rect(hair,7,-6,6,11);rect(hair,1,-6,11,3);
  rect('#16191b',1,2,11,2);rect('#7fd3f0',6,3,3,2);
  cx.restore();
  // front arm
  cx.save();cx.translate(24,-3);cx.rotate(armA);rect(skin,0,-arm/2,24,arm);rect(skinD,0,arm/2-1,24,1);rect(skinD,24,-arm/2,4,arm);cx.restore();
  cx.restore();C=prev;
}

function hud(){

  {const open=Object.keys(r.open);let want=null;if(hints&&r.phase==='glide'&&open.length){const o=r.open[open[0]];if(r.t-o.t0>2.5)want=F[open[0]].fix[0]}

let lastCoach='';
function coach(){
  const r=R;if(!r)return;let tag='STEP 1',txt='',warn=false;
  if(r.phase==='ready'){txt='Take a big breath! Hold the big button. Let go when the pink air is in the green box. More breath means more AIR time!'}
  else if(r.phase==='sink'){tag='STEP 2';txt='Hold SINK to go under. Let go when your head is in the green box. Push!'}
  else if(r.phase==='launch'){tag='PUSH';txt='Arms up by your ears. Chin down. Long like a pencil!'}
  else if(r.phase==='glide'){
    const open=Object.keys(r.open);tag='GLIDE';
    if(open.length){const id=open[open.length-1],age=r.t-r.open[id].t0;warn=true;tag=F[id].name.replace('!','');
      txt=hints&&age>1.2?F[id].tip:'Uh oh! Which button fixes it?';}
    else if(r.pullReady)txt=`50 m, ${swName()}! Press PULL: arms push down and back to your hips!`;
    else if(r.pulled)txt='Arms by your sides. Long like a torpedo! Keep going to 100 m!';
    else txt=`Stay long and straight, ${swName()}! Get to 50 m, then PULL!`;
  }
  else if(r.phase==='end'){tag='DONE';txt=r.endReason==='wall'?'100 m! You mastered Level 1: Glide!':r.endReason==='air'?'Out of air. You stood up to breathe. Good job!':'You slowed down and stopped. Great glide!'}
  const key=tag+txt;if(key===lastCoach)return;lastCoach=key;
  $('#coachTag').textContent=tag;$('#coachTag').className='tag'+(warn?' warn':'');$('#coachText').textContent=txt;
}

function breathNotes(r,dist){
  const l=r.lung0,g=Math.max(1,r.t),out=[];
  if(l>.78){out.push(['bad','TOO MUCH AIR','You started with too much air. Too much air keeps you floating too high, and your legs sink. Next time, let go of BIG BREATH when the pink is in the green box.']);
    if(r.bub)out.push(['good','NICE BUBBLES','You blew bubbles to let extra air out. That helps you sink into the glide zone!'])}
  else if(l<.5)out.push(['bad','TOO LITTLE AIR','You started with too little air. With too little air you sink too deep, and your AIR runs out faster. Next time, breathe in until the pink reaches the green box.']);
  else out.push(['good','JUST RIGHT','You started with just the right amount of air. It kept you in the glide zone with plenty of AIR.']);
  if(r.endReason==='air')out.push(['bad','OUT OF AIR',`Your air ran out at ${dist} m. A just-right breath and a long, straight body get you farther on the same air.`]);
  if(r.tHigh/g>.25&&l>.5)out.push(['meh','FLOATING HIGH','You spent a lot of time on top of the water. Blow bubbles or drop your arms to go under.']);
  if(r.tDeep/g>.25)out.push(['meh','TOO DEEP','You spent a lot of time too deep. Raise your arms, and take a bigger breath next time.']);
  if(r.bub>6)out.push(['meh','LOTS OF BUBBLES',`You blew bubbles ${r.bub} times. Each bubble uses a little air, so just blow a few.`]);
  return out;
}

  const pullNote=r.pulled?`<li><span class="chip">PULL</span><span>You pulled at ${Math.round(r.pullX*DISP)} m. Zoom!</span></li>`:dist>=50?'<li><span class="chip bad">PULL</span><span>You passed 50 m but did not PULL. Press the big PULL button to zoom to 100 m!</span></li>':'<li><span class="chip meh">PULL</span><span>Get to 50 m to unlock PULL. Stay in the glide zone to go farther.</span></li>';
  const win=won?`<div class="master"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="#16191b" d="M3 1h10v1h2v4h-1v1h-1v1h-2v2H9v2h2v1h1v2H4v-2h1v-1h2v-2H6V8H4V7H3V6H2V5H1V2h2z"/><path fill="#f5c518" d="M4 2h8v5h-1v1H9v2H7V8H5V7H4z M2 3h1v2H2z M13 3h1v2h-1z M5 13h6v1H5z"/><path fill="#fff6b0" d="M5 3h1v3H5z"/></svg>
    <div><b>You have mastered Level 1: Glide!</b><p>Go report back to Coach! Tell Coach: "I glided to 100 m!"</p></div></div>`:'';
  openModal(`<span class="eyebrow">${won?'LEVEL 1 COMPLETE':'ALL DONE!'}</span><h2>${title}</h2><p>${sub}</p>${win}
  <div class="stats">
    <div class="stat"><b>${dist} m</b><span>HOW FAR${dist>=best-0.5?' · BEST!':''}</span></div>
    <div class="stat"><b>${r.coins}</b><span>COINS</span></div>
    <div class="stat"><b>${Math.round(r.pushQ*100)}%</b><span>PUSH</span></div>
    <div class="stat"><b>${clean}/${fixes}</b><span>FIXED FIRST TRY</span></div>
  </div>
  <span class="eyebrow">YOUR BREATH</span><ul class="log">${bn}</ul>
  <span class="eyebrow">WHAT HAPPENED</span><ul class="log">${pullNote}${items}</ul>
  ${top?`<div class="tips"><h3>IN THE POOL, TRY THIS</h3>${top}</div>`:''}
  <div class="row"><button class="cbtn go" id="mAgain">Swim again</button><button class="cbtn" id="mGuide">Fix-it guide</button><button class="cbtn" id="mBreath">Breath test</button></div>`);
  $('#mAgain').onclick=()=>{newRun();closeModal()};$('#mBreath').onclick=introModal;$('#mGuide').onclick=()=>guideModal(true);
}

/* ---------- controls: keyboard + toggles ---------- */
const keymap=Object.fromEntries(ACTIONS.map(a=>[a.key,a.id]));
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.closest&&e.target.closest('.wheel')))return;
  if(e.code==='Space'){e.preventDefault();if(bt&&bt.key){if(!e.repeat)bt.key();return}if(!e.repeat)holdStart();return}
  if(e.repeat||!modal.hidden)return;const a=keymap[e.key.toLowerCase()];if(a){act(a);const b=$('#b_'+a);b.classList.add('down');setTimeout(()=>b.classList.remove('down'),120)}
});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.code==='Space'){if(modal.hidden)e.preventDefault();holdEnd()}});
const hb=$('#hintsBtn'),sb=$('#soundBtn');hb.setAttribute('aria-pressed',hints);sb.setAttribute('aria-pressed',soundOn);
hb.onclick=()=>{hints=!hints;store.set('hints',hints);hb.setAttribute('aria-pressed',hints);lastCoach='';coach()};
sb.onclick=()=>{soundOn=!soundOn;store.set('sound',soundOn);sb.setAttribute('aria-pressed',soundOn)};
$('#breathBtn').onclick=introModal;
$('#guideBtn').onclick=()=>{if(R&&R.phase==='end')guideModal(true);else guideModal(false)};
$('#swimmerBtn').onclick=()=>pickModal(false);
$('#restartBtn').onclick=()=>{newRun();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)holdEnd()});

/* ---------- loop ---------- */
newRun();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)update(dt);draw(now/1000);hud();requestAnimationFrame(loop)}
(document.fonts?document.fonts.load('8px Silkscreen'):Promise.resolve()).catch(()=>{}).finally(()=>{requestAnimationFrame(loop);setTag();if(store.get('look',null))introModal();else pickModal(true)});
})();
</script>

</body></html>
