<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Torpedo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: graph-paper game console. Meter rail left, pool window right, pixel button deck below. Single light look on purpose (it's a sketchbook). */
:root{
  --paper:#eef2f3; --grid:#d7dfe3; --ink:#16191b; --muted:#4b5961;
  --water:#3a93cf; --zone:#8fd4f0; --good:#2fae43; --bad:#dd3328; --warn:#f0a818; --coin:#f5c518;
  --btn:#cfd4d6; --btn-hi:#f1f3f4; --btn-lo:#8f989d; --card:#f8fafa;
  --pixel:"Silkscreen","Courier New",monospace; --body:"VT323","Courier New",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:12px 12px;
  color:var(--ink); font-family:var(--body); font-size:20px; line-height:1.15;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:grid;gap:12px}
.px{font-family:var(--pixel);text-transform:uppercase;letter-spacing:.04em}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{margin:0;font-family:var(--pixel);font-weight:700;font-size:clamp(22px,4.4vw,44px);line-height:1;letter-spacing:.01em;text-wrap:balance}
header h1 small{display:block;font-size:.42em;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:.06em}
.coins{display:flex;align-items:center;gap:8px;text-align:right}
.coins b{font-family:var(--pixel);font-size:clamp(28px,5vw,48px);font-variant-numeric:tabular-nums;line-height:1}
.coins small{font-family:var(--pixel);font-size:11px;line-height:1.2}

.board{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:start}
.meters{display:grid;gap:12px}
.tubes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-items:center}
.tube{display:grid;justify-items:center;gap:4px;font-family:var(--pixel);font-size:10px;text-align:center}
.tube .glass{position:relative;width:34px;height:128px;border:3px solid var(--ink);background:#fff;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.tube .fill{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--water);transition:height .08s linear}
.tube .fill.air{background:repeating-linear-gradient(0deg,#6fbfe8 0 6px,#5bb2df 6px 12px)}
.tube .fill.lung{background:#f19a9a}
.tube .fill.mom{background:#4a8fd1}
.tube .band{position:absolute;left:0;right:0;border-top:2px dashed var(--good);border-bottom:2px dashed var(--good);background:rgba(47,174,67,.14)}
.tube .rollzone{position:absolute;left:0;right:0;bottom:0;height:0;border-top:2px dashed var(--ink);background:repeating-linear-gradient(45deg,rgba(245,197,24,.55) 0 4px,rgba(245,197,24,.2) 4px 8px);pointer-events:none}
.tube .val{font-family:var(--pixel);font-size:12px;font-variant-numeric:tabular-nums}
.tube.slow .glass{box-shadow:0 0 0 3px #8fd4f0,0 0 12px 4px #8fd4f0,3px 3px 0 var(--ink)}
.tube.low .glass{border-color:var(--bad)}
.tube.low .val{color:var(--bad)}
.bar-wrap{display:grid;gap:4px}
.bar-label{font-family:var(--pixel);font-size:11px;display:flex;justify-content:space-between}
.stab{position:relative;height:22px;border:3px solid var(--ink);background:linear-gradient(90deg,var(--bad) 0 16%,var(--good) 16% 84%,var(--bad) 84%);box-shadow:3px 3px 0 var(--ink)}
.stab .mark{position:absolute;top:-6px;width:8px;height:28px;margin-left:-4px;background:#fff;border:2px solid var(--ink);left:50%}
.stab-ends{display:flex;justify-content:space-between;font-family:var(--pixel);font-size:9px;color:var(--muted)}
.hips{display:grid;grid-template-columns:24px 1fr 24px;border:3px solid var(--ink);height:28px;box-shadow:3px 3px 0 var(--ink);background:#fff}
.hips span{display:grid;place-items:center;font-size:12px;background:var(--btn)}
.hips .hv{display:grid;place-items:center;font-family:var(--pixel);font-size:12px;border-inline:3px solid var(--ink);background:linear-gradient(90deg,#8fd4f0 var(--p,50%),#e3e8ea var(--p,50%))}
.hips .hv.bad{color:var(--bad)}
.dist{font-family:var(--pixel);font-size:12px;display:flex;justify-content:space-between;border-top:2px dashed var(--btn-lo);padding-top:8px}
.dist b{font-variant-numeric:tabular-nums}

.stage-col{display:grid;gap:8px;min-width:0}
.stage{position:relative;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:#7fcbee}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.alert{position:absolute;left:50%;top:3%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-weight:700;color:var(--bad);font-size:clamp(12px,2.2vw,22px);text-shadow:2px 2px 0 #000,-1px -1px 0 #000;-webkit-text-stroke:.5px #000;white-space:nowrap;pointer-events:none}
.alert svg{width:1.4em;height:1.4em}
.alert.blink{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.toast{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-family:var(--pixel);font-size:clamp(10px,1.6vw,14px);background:var(--ink);color:#fff;padding:5px 10px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.toast.show{opacity:1}
.toast.good{background:var(--good)}
.toast.bad{background:var(--bad)}
.coach{min-height:3.2em;background:var(--card);border:3px solid var(--ink);padding:6px 10px;font-size:20px;display:flex;gap:10px;align-items:flex-start}
.coach .tag{font-family:var(--pixel);font-size:11px;background:var(--ink);color:#fff;padding:3px 6px;white-space:nowrap;margin-top:2px}
.coach .tag.warn{background:var(--bad)}
.coach p{margin:0;min-width:0}

.controls{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:stretch}
.pbtn{font-family:var(--pixel);text-transform:uppercase;color:var(--ink);background:var(--btn);border:3px solid var(--ink);box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),3px 3px 0 var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;display:grid;justify-items:center;align-content:center;gap:4px;padding:6px 4px;font-size:11px;line-height:1.1;text-align:center;position:relative}
.pbtn svg{width:30px;height:30px;shape-rendering:crispEdges}
.pbtn:active,.pbtn.down{transform:translate(2px,2px);box-shadow:inset 3px 3px 0 var(--btn-lo),inset -3px -3px 0 var(--btn-hi),1px 1px 0 var(--ink)}
.pbtn:focus-visible{outline:3px solid #1d6fd6;outline-offset:3px}
.pbtn[disabled]{opacity:.45;cursor:default}
.pbtn.ok{background:#a9e3b1}
.pbtn.hint{animation:glow .6s steps(2) infinite}
@keyframes glow{50%{background:#fff3a6}}
.guide{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.guide li{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;border:3px solid var(--ink);background:#fff;padding:8px 10px}
.guide .prob{font-family:var(--pixel);font-size:13px;color:var(--bad)}
.guide .prob small{display:block;font-family:var(--body);font-size:18px;color:var(--ink);text-transform:none;letter-spacing:0}
.guide .arrow{font-family:var(--pixel);font-size:16px}
.guide .fixb{display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-size:12px;background:var(--btn);border:3px solid var(--ink);padding:6px 8px;box-shadow:inset 2px 2px 0 var(--btn-hi),inset -2px -2px 0 var(--btn-lo)}
.guide .fixb svg{width:22px;height:22px;flex:none;shape-rendering:crispEdges}
@media (max-width:480px){.guide li{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:6px 8px}.guide .arrow{display:none}.guide .prob small{font-size:16px}.guide .fixb{font-size:10px;padding:5px 6px}.guide .fixb svg{width:18px;height:18px}}
.pbtn.no{background:#f2a9a3}
.pick-group{display:grid;gap:6px}
.picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pk{border:3px solid var(--ink);background:#8fd4f0;padding:4px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:grid;gap:3px;font-family:var(--pixel);font-size:8px;color:var(--ink)}
.pk canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.suit-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.wheel{width:200px;max-width:100%;height:auto;flex:none}
.wheel path{cursor:pointer;stroke:#16191b;stroke-width:2;transition:transform .12s}
.wheel path:hover{transform:scale(1.04)}
.wheel path[aria-checked="true"]{stroke-width:5;transform:scale(1.07)}
.wheel path:focus-visible{outline:none;stroke:#1d6fd6;stroke-width:5}
.suit-name{display:grid;gap:6px;min-width:0}
.suit-name b{font-family:var(--pixel);font-size:16px}
.suit-name small{font-size:18px;color:var(--muted)}
.pk[aria-pressed="true"]{background:#ffffff;box-shadow:0 0 0 3px var(--ink),3px 3px 0 3px var(--ink)}
.pk:focus-visible{outline:3px solid #1d6fd6;outline-offset:3px}
.name-in{font-family:var(--pixel);font-size:18px;padding:10px 12px;border:3px solid var(--ink);background:#fff;color:var(--ink);width:100%;box-shadow:inset 2px 2px 0 var(--btn-lo)}
@media (max-width:560px){.picker{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pbtn kbd{position:absolute;top:3px;right:4px;font-family:var(--pixel);font-size:9px;color:var(--muted)}
.hold{font-size:13px;min-height:112px}
.hold svg{width:40px;height:40px}
.hold .sub{font-size:9px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.pad .pbtn{min-height:112px}
.pad .grp{display:none}
.foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;font-size:18px;color:var(--muted)}
.foot .links{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{font-family:var(--pixel);font-size:11px;background:var(--card);border:2px solid var(--ink);padding:5px 8px;cursor:pointer;color:var(--ink)}
.tbtn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}

/* modal */
.modal{position:fixed;inset:0;background:rgba(22,25,27,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.card{width:min(560px,100%);background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px;display:grid;gap:14px;max-height:calc(100% - 8px);overflow-y:auto}
.card h2{margin:0;font-family:var(--pixel);font-size:24px;line-height:1.1;text-wrap:balance}
.card p{margin:0;font-size:21px;max-width:60ch}
.card .eyebrow{font-family:var(--pixel);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.cbtn{font-family:var(--pixel);font-size:13px;text-transform:uppercase;padding:12px 14px;border:3px solid var(--ink);background:var(--btn);box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),3px 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
.cbtn.go{background:#8fd4f0}
.cbtn:active{transform:translate(2px,2px)}
.cbtn:disabled{opacity:.6;cursor:default;transform:none}
@media (hover:none){.cbtn:active{transform:none}}
.breather{display:grid;place-items:center;height:190px}
.breather .sq{width:150px;height:150px;background:#8fd4f0;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font-family:var(--pixel);font-size:28px;transition:transform .1s linear;image-rendering:pixelated}
.cue{font-family:var(--pixel);font-size:18px;text-align:center}
.bigtime{font-family:var(--pixel);font-size:56px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.tank{height:18px;border:3px solid var(--ink);background:#fff;position:relative}
.tank i{position:absolute;inset:0 auto 0 0;background:#6fbfe8;width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border:3px solid var(--ink);background:#fff;padding:8px;display:grid;gap:4px}
.stat b{font-family:var(--pixel);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--pixel);font-size:9px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:19px;border-bottom:1px dashed var(--btn-lo);padding-bottom:5px}
.log .chip{font-family:var(--pixel);font-size:10px;padding:3px 6px;color:#fff;background:var(--good);white-space:nowrap;margin-top:2px}
.log .chip.meh{background:var(--warn);color:var(--ink)}
.log .chip.bad{background:var(--bad)}
.master{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;border:3px solid var(--ink);background:#fff3a6;padding:12px;box-shadow:4px 4px 0 var(--ink)}
.master svg{width:72px;height:72px}
.master b{font-family:var(--pixel);font-size:16px;display:block;margin-bottom:6px}
.master p{font-size:21px}
.arms-panel{display:grid;gap:4px;border-top:2px dashed var(--btn-lo);padding-top:8px}
.arms-panel label{font-family:var(--pixel);font-size:10px}
.armok{font-family:var(--pixel);font-size:10px;padding:1px 5px;background:var(--good);color:#fff}
.armok.bad{background:var(--bad)}
.rng{position:relative}
.rng::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:2px;margin-left:-1px;background:var(--good);pointer-events:none}
.rng input{width:100%;margin:0;accent-color:#3a93cf;height:24px;touch-action:pan-x}
.rng input:disabled{opacity:.4}
.rng-ends{display:flex;justify-content:space-between;font-family:var(--pixel);font-size:8px;color:var(--muted)}
.needbtn{position:fixed;left:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;rotate:180deg;font-family:var(--pixel);font-size:12px;letter-spacing:.1em;padding:14px 7px;background:#8fd4f0;color:var(--ink);border:3px solid var(--ink);border-right:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;z-index:9}
@media (max-width:760px){.needbtn{writing-mode:horizontal-tb;rotate:none;top:auto;bottom:0;left:0;right:0;transform:none;font-size:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-width:3px 0 0 0;box-shadow:none}.app{padding-bottom:72px}}
.needbtn:focus-visible{outline:3px solid #1d6fd6;outline-offset:3px}
.sumtab{position:fixed;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:var(--pixel);font-size:12px;letter-spacing:.12em;padding:14px 7px;background:var(--coin);color:var(--ink);border:3px solid var(--ink);border-right:0;box-shadow:-3px 3px 0 var(--ink);cursor:pointer;z-index:9}
.sumtab[aria-expanded="true"]{right:min(680px,100vw)}
.sumpanel{position:fixed;top:0;right:0;bottom:0;width:min(680px,100vw);background:var(--card);border-left:3px solid var(--ink);box-shadow:-6px 0 0 rgba(22,25,27,.25);z-index:9;overflow-y:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sum-head h2{margin:0;font-family:var(--pixel);font-size:24px}
.sum-scope{margin:0;color:var(--muted)}
.sum-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.sum-h{margin:4px 0 0;font-family:var(--pixel);font-size:13px}
#sumBody{display:grid;gap:10px;min-width:0}
@media (max-width:560px){.sumtab[aria-expanded="true"]{display:none}.sum-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:8px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti i{animation-duration:0s!important}}
.tank.full{border-color:var(--coin);box-shadow:0 0 0 3px var(--ink)}
.tank.full i{background:var(--coin)}
.levelline{border:3px dashed var(--ink);padding:8px 10px;background:#fff}
.warnbox{border:3px solid var(--bad);background:#fde3e0;padding:8px 10px}
.scard{display:inline-block;font-family:var(--body);font-size:18px;background:#fff;border:2px dashed var(--ink);padding:6px 8px;margin-block:6px;user-select:all;-webkit-user-select:all}
.choice .cbtn{font-size:11px;padding:9px 10px}
.stars .star{font-size:30px;line-height:1;background:none;border:none;color:var(--btn-lo);cursor:pointer;padding:2px}
.stars .star.on{color:var(--coin);text-shadow:2px 2px 0 var(--ink)}
.fb{display:grid;gap:10px}
.tablewrap{overflow-x:auto;max-width:100%}
.tablewrap table{border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.tablewrap th,.tablewrap td{border:1px solid var(--btn-lo);padding:3px 6px;text-align:left;white-space:nowrap}
.tablewrap th{font-family:var(--pixel);font-size:9px;background:var(--btn)}
.tips{border:3px solid var(--ink);background:#e5f5fc;padding:10px 12px;display:grid;gap:6px}
.tips h3{margin:0;font-family:var(--pixel);font-size:13px}
.tips p{font-size:20px}

@media (max-width:760px){
  body{font-size:19px}
  .board{grid-template-columns:1fr}
  .meters{order:2;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:start}
  .tubes{gap:6px}
  .tube .glass{width:26px;height:78px}
  .tube{font-size:8px}
  .side{display:grid;gap:10px;min-width:0}
  .stage-col{order:1}
  .controls{grid-template-columns:1fr}
  .hold{min-height:64px;grid-auto-flow:column;gap:10px}
  .hold svg{width:28px;height:28px}
  .pad{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .pad .pbtn{min-height:74px;font-size:9px}
  .pad .pbtn svg{width:24px;height:24px}
  .pbtn kbd{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .coach{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.alert.blink{animation:none}.tube .fill{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <h1>Torpedo!<small>Level 1 · Push &amp; Glide<span id="swTag"></span></small></h1>
    <div class="coins"><b id="coinN">0</b><small>COINS<br>COLLECTED</small></div>
  </header>

  <div class="board">
    <aside class="meters" aria-label="Body meters">
      <div class="tubes">
        <div class="tube" id="tAir"><span>AIR<br>&nbsp;</span><div class="glass"><div class="fill air" id="fAir"></div><div class="rollzone" id="rollZone"></div></div><span class="val" id="vAir">--</span></div>
        <div class="tube" id="tLung"><span>LUNGS<br>&nbsp;</span><div class="glass"><div class="band" style="bottom:55%;height:20%"></div><div class="fill lung" id="fLung"></div></div><span class="val" id="vLung">0%</span></div>
        <div class="tube" id="tMom"><span>SPEED<br>&nbsp;</span><div class="glass"><div class="fill mom" id="fMom"></div></div><span class="val" id="vMom">0</span></div>
      </div>
      <div class="side">
        <div class="bar-wrap">
          <div class="bar-label"><span>BALANCE</span></div>
          <div class="stab"><div class="mark" id="stabMark"></div></div>
          <div class="stab-ends"><span>LEGS DOWN</span><span>HEAD DOWN</span></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label"><span>BOTTOM &amp; LEGS</span></div>
          <div class="hips"><span aria-hidden="true">▲</span><div class="hv" id="hipsV">just right</div><span aria-hidden="true">▼</span></div>
        </div>
        <div class="dist"><span>HOW FAR</span><b id="distV">0 m / 100 m</b></div>
        <div class="arms-panel" id="armsPanel">
          <div class="bar-label"><span>ARMS</span><span id="armOk" class="armok bad">NOT STRAIGHT</span></div>
          <label for="armH">ARM HEIGHT</label>
          <div class="rng"><input type="range" id="armH" min="-1" max="1" step="0.05" value="0"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=384,H=216,SURF=46,PXM=66,PXH=40,FLOOR=SURF+2*PXM;
const ZT=.15,ZB=.55,POOL=25,HALF=12.5,DISP=4,HEADOFF=38/PXM;
// SLOW stretches the swim in time without changing distances: a clean run to 100 m takes ~30 s of air
const SLOW=.37, SPD=3.2*SLOW;
const postErr=r=>r.pulled||r.armH==null?0:Math.max(0,Math.abs(r.armH)-.1);
const headDepth=r=>r.d-HEADOFF*Math.sin(-r.rot);
const randPost=()=>(Math.random()<.5?-1:1)*(.3+Math.random()*.5);
// ROLL lights up this many seconds before AIR hits 0 (20% of the breath test, 2 to 6 s)
const rollWin=()=>clamp((hold||20)*.2,2,6);
const AIRF=l=>.6+.4*l; // share of breath-test air you get for a given breath
const mod=(a,n)=>((a%n)+n)%n, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;

const store={get(k,d){try{const v=localStorage.getItem('gg_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gg_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- body faults: what went wrong, how to fix it in the game, what to feel at the pool ---------- */
const F={
  deep:{name:'TOO DEEP!',fix:['armsUp','lift'],drag:.04,tip:'You sank too low. Raise your arms to swim back up!',pool:'Point your hands a little up, like a plane taking off.'},
  surface:{name:'TOO HIGH!',fix:['armsDown','bubbles','chin'],drag:.03,wait:2,tip:'You popped up. Wait a moment, it usually fixes itself! Still high? Drop your arms.',pool:'Point your hands a little down so you glide just under the water.'},
  headUp:{name:'FACE TOO HIGH!',fix:['chin'],drag:.05,tip:'You are looking forward. Tuck your chin and look at the floor!',pool:'Look down at the black line on the bottom of the pool.'},
  dive:{name:'NOSE DIVE!',fix:['lift'],drag:.04,tip:'Your chin is squished down. Lift your head a tiny bit!',pool:'Pretend you hold a little ball under your chin.'},
  legDrop:{name:'LEGS SINKING!',fix:['core'],drag:.07,tip:'Your legs are falling down. Make a tight tummy!',pool:'Squeeze your tummy like a rock. Your feet float up.'},
  pike:{name:'BOTTOM UP!',fix:['relax'],drag:.05,tip:'Your bottom popped up. Make a soft tummy to get flat!',pool:'Be long and straight like a pencil.'},
  legsCross:{name:'LEGS CROSSING!',fix:['legs'],drag:.07,tip:'Your legs are wiggling apart. Squeeze your legs together!',pool:'Stick your big toes together like glue.'},
};
const ACTIONS=[
  {id:'armsUp',label:'Raise Arms',key:'q',icon:'<path d="M7 1h2v2h2v2h2v2H9v8H7V7H3V5h2V3h2z"/>'},
  {id:'chin',label:'Chin Tuck',key:'w',icon:'<path d="M1 2h8v8H1z M11 5h2v6h2v2h-1v1h-1v1h-2v-1h-1v-1H9v-2h2z"/><path fill="#16191b" d="M5 7h3v1H5z"/>'},
  {id:'core',label:'Tight Tummy',key:'e',icon:'<path d="M6 2h4v12H6z M0 7h3V5h1v2h1v2H4v2H3V9H0z M16 7h-3V5h-1v2h-1v2h1v2h1V9h3z"/>'},
  {id:'legs',label:'Squeeze Legs',key:'r',icon:'<path d="M3 1h3v6h1v8H5V9H4V8H3z M13 1h-3v6H9v8h2V9h1V8h1z"/>'},
  {id:'armsDown',label:'Drop Arms',key:'a',icon:'<path d="M7 1h2v8h4v2h-2v2H9v2H7v-2H5v-2H3V9h4z"/>'},
  {id:'lift',label:'Lift Head',key:'s',icon:'<path d="M1 6h8v8H1z M11 1h2v1h1v1h1v2h-2v6h-2V5H9V3h1V2h1z"/><path fill="#16191b" d="M6 8h2v1H6z"/>'},
  {id:'relax',label:'Soft Tummy',key:'d',icon:'<path d="M7 2h2v12H7z M0 7h1V5h1V4h1v3h2v2H3v3H2v-1H1V9H0z M16 7h-1V5h-1V4h-1v3h-2v2h2v3h1v-1h1V9h1z"/>'},
  {id:'bubbles',label:'Blow Bubbles',key:'f',icon:'<path d="M2 9h5v5H2z M9 4h4v4H9z M10 11h3v3h-3z M5 2h3v3H5z"/><path fill="#cfd4d6" d="M3 10h2v2H3z M10 5h2v2h-2z"/>'},
];
const LABEL=Object.fromEntries(ACTIONS.map(a=>[a.id,a.label]));

/* ---------- build button pad ---------- */
const pad=$('#pad');
ACTIONS.forEach(a=>{
  const b=document.createElement('button');b.className='pbtn';b.id='b_'+a.id;
  b.innerHTML=`<kbd>${a.key.toUpperCase()}</kbd>${a.label.replace(' ','<br>')}<svg viewBox="0 0 16 16" fill="currentColor">${a.icon}</svg>`;
  b.addEventListener('pointerdown',e=>{e.preventDefault();act(a.id)});
  b.addEventListener('click',e=>{if(e.detail===0)act(a.id)});
  pad.appendChild(b);
});

/* ---------- sound ---------- */
let AC=null,soundOn=store.get('sound',true);
function beep(f,d=.08,type='square',vol=.05,slide=0){
  if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,AC.currentTime+d);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

/* ---------- state ---------- */
let look=store.get('look',null)||{g:'m',skin:0,build:0,name:''};
const swName=()=>(look.name||'').trim()||'Swimmer';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let hold=store.get('hold',null), best=store.get('best100',0), hints=store.get('hints',true);
let R, holding=false, paused=true, toastT=0;

function makeCoins(){
  const pats=[[.35,.35,.35],[.25,.3,.35],[.4,.45,.5],[.3,.3],[.55,.6,.62],[.35,.3,.25],[.4,.4,.4],[.22,.22]];
  const c=[];let x=3.4;
  pats.forEach(p=>{p.forEach((d,i)=>{if(x+i*.7<24.2)c.push({x:x+i*.7,d,got:false})});x+=2.6+Math.random()*.5});
  return c;
}
function newRun(){
  R={phase:'ready',x:.26,d:.42,vD:0,rot:-Math.PI/2,mom:0,lung:0,air:0,airMax:0,head:0,arms:0,hips:0,legs:0,coreT:0,
     t:0,clock:0,coins:0,coinList:makeCoins(),open:{},log:[],nextEv:3,pushQ:0,pushMsg:'',msgT:0,bubbles:[],sparks:[],
     filling:false,armT:0,hintOn:null,sinking:false,floorT:0,endReason:'',endT:0,shown:false,wrongCount:0,lung0:0,bub:0,tHigh:0,tDeep:0,pulled:false,pullT:0,pullReady:false,pullX:0,confetti:[],over:0,overLog:[],burst:0,burstCue:false,breatheReady:false,exhaleT:0,exhaling:false,armH:randPost(),postAtPush:0,highPush:false,highPen:0,needAir:false,needT:0,rolling:false,atSurface:false,rollT:0,rolls:0,burstTotal:0,exhaleTotal:0,cycles:0,flip:1};
  syncArms();holding=false;setHold();coach();
}

/* ---------- hold button (breathe in / sink & push) ---------- */
const holdBtn=$('#holdBtn');
function holdStart(){
  if(paused||holding)return;holding=true;holdBtn.classList.add('down');
  if(R.phase==='ready'){R.filling=true;beep(300,.15,'sine',.04,200)}
  else if(R.phase==='sink'){R.sinking=true;beep(260,.2,'sine',.04,-120)}
  else if(R.phase==='glide'){const m=R.btnMode;if(m==='need')doBreathe();else if(m==='roll'){R.breathHold=true;setHold()}else if(m==='out'){R.exhaling=true;beep(330,.4,'sine',.04,-150);setHold()}else if(m==='pull')doPull();else if(!R.pulled)toast('GLIDE TO 50 M FIRST!')}
}
function doBreathe(){
  const r=R;
  if(r.d>ZB+.1){r.stoodWhy='deep';endRun('stood');toast('TOO DEEP TO ROLL OVER','bad');return}
  r.rollAir=Math.max(0,r.air);r.rollX=r.x+1.25;r.canRoll=false;r.needAir=false;r.rolling=true;r.rollT=0;r.relT=0;r.breathHold=true;r.rolls++;r.exhaling=false;r.vD=0;
  r.open={};r.head=0;r.arms=0;r.armT=0;r.legs=0;r.hips=0;
  beep(440,.15,'sine',.04,200);toast('ROLL! KEEP HOLDING TO THE SURFACE','good');setHold();coach();
}
function doPull(){
  const r=R;r.pulled=true;r.pullReady=false;r.pullT=.5;r.pullX=r.x+1.25;r.mom=Math.min(1,r.mom+.6);
  for(let i=0;i<14;i++)r.bubbles.push({x:r.x+.3+Math.random()*.6,d:r.d+.05,v:.3+Math.random()*.6,s:Math.random()*6});
  beep(200,.35,'sawtooth',.05,700);toast('PULL! ZOOM!','good');setHold();coach();
}
function holdEnd(){
  if(!holding)return;holding=false;holdBtn.classList.remove('down');
  if(R.phase==='ready'&&R.filling)lockLungs();
  else if(R.phase==='sink'&&R.sinking)launch();
  if(R.exhaling){R.exhaling=false;setHold()}
  if(R&&R.rolling&&R.breathHold&&R.phase==='glide'){R.breathHold=false;
    if(R.atSurface){for(let i=0;i<16;i++)R.bubbles.push({x:R.x+1+Math.random()*.2,d:.06,v:.3+Math.random()*.3,s:Math.random()*6});beep(330,.4,'sine',.04,-150);toast('BREATHE OUT. JUST RIGHT!','good');endRun('rolled')}
    else if(R.air<=0){R.stoodWhy='air';toast('OUT OF AIR!','bad');endRun('stood')}
    else{toast('YOU LET GO UNDER THE WATER','bad');endRun('underwater')}}
}
holdBtn.addEventListener('pointerdown',e=>{e.preventDefault();holdBtn.setPointerCapture(e.pointerId);holdStart()});
holdBtn.addEventListener('pointerup',holdEnd);holdBtn.addEventListener('pointercancel',holdEnd);
holdBtn.addEventListener('contextmenu',e=>e.preventDefault());
function setHold(){
  const p=R?R.phase:'ready';
  const g=!!(R&&p==='glide'), roll=g&&R.rolling, canPull=g&&!R.needAir&&!roll&&R.pullReady&&R.air>2, need=g&&(R.needAir||(R.canRoll&&!canPull)), br=false, pulled=!!(R&&R.pulled);
  if(R)R.btnMode=need?'need':roll?'roll':br?'out':canPull?'pull':null;
  holdBtn.disabled=!(p==='ready'||p==='sink'||need||roll||canPull||br);
  holdBtn.classList.toggle('hint',need||(roll&&R.atSurface)||canPull||(br&&!R.exhaleT));
  $('#holdLabel').textContent=p==='ready'?'HOLD: BIG BREATH':p==='sink'?'HOLD: SINK':need?'ROLL':roll?(R.atSurface?'BREATHE OUT':'HOLD'):canPull?'PULL!':br?'LONG BUBBLES':pulled?'PULLED!':'PULL AT 50 M';
  $('#holdSub').textContent=p==='ready'?'LET GO WHEN IT IS GREEN':p==='sink'?'LET GO TO PUSH!':need?'HOLD TO ROLL ONTO YOUR BACK':roll?(R.atSurface?'LET GO TO BREATHE OUT':'KEEP HOLDING TO THE SURFACE'):canPull?'ONE TIME ONLY!':br?'HOLD: ONE LONG BREATH OUT':pulled?'ARMS BY YOUR SIDES':'GLIDE TO 50 M FIRST';
  $('#armH').disabled=p==='end'||pulled;
}

function lockLungs(){
  R.filling=false;R.lung=Math.max(.12,R.lung);
  R.airMax=(hold||20)*AIRF(R.lung);R.air=R.airMax;R.lung0=R.lung;
  R.phase='sink';setHold();
  const l=R.lung;
  toast(l>.78?'TOO MUCH AIR: YOU WILL FLOAT UP':l<.5?'LITTLE BREATH: LESS AIR':'PERFECT BREATH!',l>.78||l<.5?'':'good');
  coach();
}
function launch(){
  R.sinking=false;
  const hd=Math.max(0,headDepth(R));let q,msg;
  if(hd<ZT){q=.55+.35*(hd/ZT);msg=hd<.04?'TOO HIGH':'A LITTLE HIGH'}
  else if(hd<=ZB){q=1;msg='SUPER PUSH!'}
  else{q=Math.max(.5,1-(hd-ZB)*.7);msg='TOO DEEP'}
  R.pushQ=q;R.pushMsg=msg;R.msgT=1.8;R.mom=q;R.d0=R.d;R.dT=Math.max(.06,hd+.04);R.lt=0;R.rot0=R.rot;R.phase='launch';R.highPush=hd<ZT;R.vD=0;R.postAtPush=postErr(R);setHold();
  if(R.highPush)setTimeout(()=>toast('TOO HIGH! WAVES SLOW YOU DOWN','bad'),500);
  beep(q===1?880:520,.18,'square',.05,q===1?300:0);
  coach();
}

/* ---------- body actions ---------- */
function act(a){
  if(paused)return;
  const b=$('#b_'+a);
  if(R.phase!=='glide'){flashBtn(b,'');if(R.phase==='ready'||R.phase==='sink')toast('FIRST: '+(R.phase==='ready'?'BIG BREATH IN':'SINK & PUSH'));return}
  const open=Object.keys(R.open);
  const right=open.filter(id=>F[id].fix.includes(a));
  switch(a){
    case 'armsUp':R.arms=1;R.armT=1.3;break;
    case 'armsDown':R.arms=-1;R.armT=1.3;break;
    case 'chin':R.head=Math.max(-1,R.head-1);break;
    case 'lift':R.head=Math.min(1,R.head+1);break;
    case 'core':R.hips=Math.min(1,R.hips+.3);R.coreT=2.5;break;
    case 'relax':R.hips=Math.max(-1,R.hips-.3);R.coreT=0;break;
    case 'legs':R.legs=0;break;
    case 'bubbles':R.bub++;R.lung=Math.max(.15,R.lung-(R.burstCue?.02:.07));R.air=Math.max(0,R.air-.3);R.slowAirT=3;
      for(let i=0;i<6;i++)R.bubbles.push({x:R.x+.95+Math.random()*.15,d:R.d-.05,v:.5+Math.random()*.5,s:Math.random()*6});
      beep(900+Math.random()*300,.05,'sine',.03);
      if(R.lung<.3)toast('ALMOST NO AIR LEFT IN YOUR TUMMY!','bad');
      break;
  }
  if(a==='bubbles'&&R.burstCue){R.burst++;if(R.burst===3)toast('NICE LITTLE BUBBLES!','good')}
  const early=right.filter(id=>F[id].wait&&R.t-R.open[id].t0<F[id].wait);
  if(right.length&&early.length===right.length){R.over++;R.overLog.push(a);R.mom*=.97;flashBtn(b,'no');toast('WAIT! IT FIXES ITSELF','bad');beep(160,.1,'sawtooth',.03)}
  else if(right.length){right.forEach(id=>R.open[id].by=a);flashBtn(b,'ok');}
  else if(!open.length&&a!=='bubbles'){R.over++;R.overLog.push(a);R.mom*=.97;flashBtn(b,'no');toast('OOPS! NOTHING TO FIX','bad');beep(160,.1,'sawtooth',.03)}
  else if(open.length&&a!=='bubbles'){open.forEach(id=>R.open[id].wrong.push(a));R.wrongCount++;flashBtn(b,'no');toast('OOPS! TRY ANOTHER BUTTON','bad');beep(140,.12,'sawtooth',.04)}
  else flashBtn(b,'');
}
function flashBtn(b,c){if(!b)return;b.classList.remove('ok','no');if(c){b.classList.add(c);setTimeout(()=>b.classList.remove(c),260)}}

/* ---------- fault detection with a little hysteresis ---------- */
function faultList(r){
  const f=[];
  if(r.head>0)f.push('headUp');if(r.head<0)f.push('dive');
  if(r.hips<-.3)f.push('legDrop');if(r.hips>.35)f.push('pike');
  if(r.legs)f.push('legsCross');
  if(r.d<(r.open.surface?.13:.09))f.push('surface');
  if(r.d>(r.open.deep?.78:.86))f.push('deep');
  return f;
}
const EVENTS=[
  {w:3,ok:r=>r.head===0,go:r=>r.head=1},
  {w:1.4,ok:r=>r.head===0&&r.d<.6,go:r=>r.head=-1},
  {w:2.5,ok:r=>r.d<.6,go:r=>{r.vD=.9}},
  {w:2,ok:r=>r.d>.2,go:r=>{r.vD=-.9}},
  {w:3,ok:r=>r.hips>-.2,go:r=>r.hips=Math.min(r.hips,-.55)},
  {w:1.2,ok:r=>r.hips<.2,go:r=>r.hips=.6},
  {w:2.5,ok:r=>!r.legs,go:r=>r.legs=1},
];
function fireEvent(r){
  const pool=EVENTS.filter(e=>e.ok(r));if(!pool.length)return;
  let tot=pool.reduce((s,e)=>s+e.w,0),x=Math.random()*tot;
  for(const e of pool){x-=e.w;if(x<=0){e.go(r);return}}
}

/* ---------- update ---------- */
function update(dt){
  const r=R;r.clock+=dt;if(r.msgT>0)r.msgT-=dt;
  r.bubbles.forEach(b=>{b.d-=b.v*dt;b.x+=Math.sin(b.d*18+b.s)*.12*dt});r.bubbles=r.bubbles.filter(b=>b.d>0);
  r.sparks.forEach(s=>{s.t-=dt;s.y-=12*dt});r.confetti.forEach(c=>{c.y+=c.v*dt;c.x+=Math.sin(c.y*.1+c.w)*.4});r.sparks=r.sparks.filter(s=>s.t>0);

  if(r.phase==='ready'){
    if(r.filling)r.lung=Math.min(1,r.lung+.42*dt);
    r.d=.42-r.lung*.06+Math.sin(r.clock*2)*.01;
  }
  else if(r.phase==='sink'){
    if(r.sinking){
      r.d+=.35*dt;const lean=clamp((r.d-.36)/.8,0,1);r.rot=-Math.PI/2+lean*1.1;
      const hd=headDepth(r);
      if(hd>0){r.air-=dt;if(Math.random()<dt*3)r.bubbles.push({x:r.x+.3,d:hd,v:.6,s:Math.random()*6})}
      if(hd>1.1)launch();
    } else r.d=.36+Math.sin(r.clock*2)*.01;
  }
  else if(r.phase==='launch'){
    r.lt+=dt;const k=Math.min(1,r.lt/.45),e=1-Math.pow(1-k,3);
    r.rot=r.rot0*(1-e);r.d=lerp(r.d0,r.dT,e);r.x+=r.mom*SPD*dt*e;r.air-=dt;
    if(k>=1){r.phase='glide';r.t=0;setHold();coach()}
    else r.vD=r.vD||0;
  }
  else if(r.phase==='glide'){
    r.t+=dt;r.air-=dt*(r.slowAirT>0?.75:1);if(r.slowAirT>0)r.slowAirT-=dt;   // bubbles: AIR drains at 75% for 3 s after a tap
   
    const spd=SPD*r.mom, eq=r.rolling?.04:.05+(1-r.lung)*1.1, steer=r.rolling?0:r.head*.45+r.arms*.6+(r.pulled?0:-r.armH*.15);
    const acc=(eq-r.d)*1.4-steer*Math.min(1.1,r.mom)*1.7*.9-r.vD*2;
    if(!r.rolling){r.vD+=acc*dt;r.d+=r.vD*dt}
    if(r.d<.03){r.d=.03;r.vD=Math.max(0,r.vD)}
    let floor=false;if(r.d>1.8){r.d=1.8;r.vD=Math.min(0,r.vD);floor=true}
    let drift=(.035+Math.max(0,r.lung-.55)*.5+(r.head>0?.12:0))*SLOW;
    if(r.coreT>0){r.coreT-=dt;drift*=.4}
    if(r.pullT>0)r.pullT-=dt;
    if(r.d<.12)r.tHigh+=dt;if(r.d>.8)r.tDeep+=dt;
    {// breath cues follow THIS swimmer's air (from the breath test), not the distance
     const used=r.airMax?1-r.air/r.airMax:0;
     if(!r.rolling&&!r.needAir){
       if(!r.burstCue&&used>=.5){r.burstCue=true;toast('LITTLE BUBBLES: HM, HM, HM','good');coach()}
     }
     if(r.exhaling){r.exhaleT+=dt;if(Math.random()<dt*14)r.bubbles.push({x:r.x+1.05,d:r.d-.04,v:.5+Math.random()*.4,s:Math.random()*6})}
     if(r.rolling){

  const bn=breathNotes(r,dist).map(([c,h,t])=>`<li><span class="chip ${c==='good'?'':c}">${h}</span><span>${t}</span></li>`).join('');
  const pullNote=r.pulled?`<li><span class="chip">PULL</span><span>You pulled at ${Math.round(r.pullX*DISP)} m. Zoom!</span></li>`:r.pullLost?'<li><span class="chip meh">PULL</span><span>Your air was down to 2 seconds, so PULL went away. Breathing comes first!</span></li>':(r.rollX&&r.rollX*DISP<50)?'<li><span class="chip meh">PULL</span><span>You rolled to breathe before 50 m, so there was no PULL this time.</span></li>':dist>=50?'<li><span class="chip bad">PULL</span><span>You passed 50 m but did not PULL. Press the big PULL button to zoom to 100 m!</span></li>':'<li><span class="chip meh">PULL</span><span>Get to 50 m to unlock PULL. Stay in the glide zone to go farther.</span></li>';
  const win=won?`<div class="master"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="#16191b" d="M3 1h10v1h2v4h-1v1h-1v1h-2v2H9v2h2v1h1v2H4v-2h1v-1h2v-2H6V8H4V7H3V6H2V5H1V2h2z"/><path fill="#f5c518" d="M4 2h8v5h-1v1H9v2H7V8H5V7H4z M2 3h1v2H2z M13 3h1v2h-1z M5 13h6v1H5z"/><path fill="#fff6b0" d="M5 3h1v3H5z"/></svg>
    <div><b>Milestone: Glide!</b><p>You glided to 100 m.</p></div></div><p class="levelline">${levelLine()}</p>`:'';
  openModal(`<span class="eyebrow">${won?'LEVEL 1 COMPLETE':'ALL DONE!'}</span><h2>${title}</h2><p>${sub}</p>${win}
  <div class="stats">
    <div class="stat"><b>${dist} m</b><span>HOW FAR${dist>=best-0.5?' · BEST!':''}</span></div>
    <div class="stat"><b>${r.coins}</b><span>COINS</span></div>
    <div class="stat"><b>${Math.round(r.pushQ*100)}%</b><span>PUSH</span></div>
    <div class="stat"><b>${clean}/${fixes}</b><span>FIXED FIRST TRY</span></div>
  </div>
  <span class="eyebrow">YOUR BREATH</span><ul class="log">${bn}</ul>
  <span class="eyebrow">WHAT HAPPENED</span><ul class="log">${pullNote}${reactNotes(r)}${items}</ul>
  ${top?`<div class="tips"><h3>IN THE POOL, TRY THIS</h3>${top}</div>`:''}
  <div class="row"><button class="cbtn go" id="mSave">Save my score</button><button class="cbtn" id="mAgain">Swim again</button><button class="cbtn" id="mGuide">Fix-it guide</button><button class="cbtn" id="mFb">Feedback</button></div>`);
  if(!r.rec){r.rec=runRecord(r,dist,clean,fixes);try{const h=store.get('history',[]);h.push(r.rec);store.set('history',h.slice(-200))}catch(_){}}
  $('#mSave').onclick=()=>saveModal(r.rec);$('#mFb').onclick=()=>feedbackModal(()=>showResultsAgain());
  $('#mAgain').onclick=()=>{newRun();closeModal()};$('#mGuide').onclick=()=>guideModal(true);
  lastResultsHTML=card.innerHTML;
}

/* ---------- scores & feedback (saved to this game's database when the viewer can write) ---------- */
let DB=null,UID=null,OWNER=false,lastResultsHTML='';
function showResultsAgain(){showResults()}
(async()=>{
  for(let i=0;i<25&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,200));
  if(!(window.claude&&window.claude.use))return;
  try{const u=await window.claude.use('user');if(u){UID=await u.id();OWNER=await u.isOwner()}}catch(e){}
  try{DB=await window.claude.use('db')}catch(e){DB=null}
})();
function runRecord(r,dist,clean,fixes){
  return {ts:new Date().toISOString(),name:swName(),dist,coins:r.coins,push:Math.round(r.pushQ*100),breathStart:Math.round(r.lung0*100),
    breathNote:r.lung0>.78?'too much':r.lung0<.5?'too little':'just right',end:r.endReason,pulled:r.pulled,pullAt:r.pulled?Math.round(r.pullX*DISP):null,
    fixedFirst:clean,fixes,overFixes:r.over,slowFixes:r.log.filter(l=>!F[l.id].wait&&(l.dt>3||!l.fixed)).length,bubbleBursts:r.burstTotal,longExhale:+r.exhaleTotal.toFixed(1),rollOvers:r.rolls,rollAirLeft:r.rolls?+(r.rollAir||0).toFixed(1):null,highPush:r.highPush,glideMilestone:!!store.get('mastered',false),breathControl:!!store.get('breathCtrl',false),armsStraight:r.postAtPush===0,
    breathTest:Math.round(hold||0),airUsed:Math.round(r.airMax-r.air),heldBreath:'',dizzy:''};
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function ensureDb(){
  if(!DB||!UID)throw new Error('unavailable');
  try{const perm=await window.claude.use('permissions');if(perm){const st=await withTimeout(perm.request(['db']),30000);if(st&&(st.db==='denied'||st.db==='unavailable'))throw new Error('denied')}}catch(e){if(e.message==='denied'||e.message==='timeout')throw e}
}
async function appendTo(col,item,cap){
  await ensureDb();return withTimeout(appendRaw(col,item,cap),15000);
}
async function appendRaw(col,item,cap){
  const ref=DB.doc(col+'/'+UID),snap=await ref.get(),prev=(snap.exists&&Array.isArray(snap.data().items))?snap.data().items:[];
  await ref.set({items:[...prev,item].slice(-cap),updatedAt:item.ts});
}
function cardText(rec){return `TORPEDO! ${rec.name} · ${new Date(rec.ts).toLocaleDateString()} · ${rec.dist} m · coins ${rec.coins} · push ${rec.push}% · breath ${rec.breathNote} · ${rec.pulled?'pulled at '+rec.pullAt+' m':'no pull'} · fixed first try ${rec.fixedFirst}/${rec.fixes} · extra fixes ${rec.overFixes} · slow fixes ${rec.slowFixes} · held my breath: ${rec.heldBreath||'?'} · dizzy: ${rec.dizzy||'?'}`}
function choice(id,opts){return `<div class="row choice" id="${id}">${opts.map(o=>`<button class="cbtn" data-v="${o}">${o}</button>`).join('')}</div>`}
function bindChoice(id,cb){const el=$('#'+id);el.querySelectorAll('button').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(o=>o.classList.toggle('go',o===b));cb(b.dataset.v)})}
function saveModal(rec){
  openModal(`<span class="eyebrow">SAVE MY SCORE</span><h2>${esc(rec.name)}: ${rec.dist} m</h2>
  <p><b>Did you hold your own breath while you played?</b></p>${choice('qHeld',['Yes, the whole time','Some of the time','Not this time'])}
  <p><b>Did you feel dizzy?</b></p>${choice('qDizzy',['No','A little','Yes'])}
  <p id="dizzyMsg" class="warnbox" hidden>Take a break. Breathe normally and tell a grown-up how you feel. Play again only when you feel good.</p>
  <div class="row"><button class="cbtn go" id="mDoSave">Save</button><button class="cbtn" id="mBack">Back</button></div>
  <p id="saveMsg" style="color:var(--muted)"></p>`);
  bindChoice('qHeld',v=>rec.heldBreath=v);
  bindChoice('qDizzy',v=>{rec.dizzy=v;$('#dizzyMsg').hidden=v==='No'});
  $('#mBack').onclick=()=>showResults();
  $('#mDoSave').onclick=async()=>{
    const btn=$('#mDoSave'),msg=$('#saveMsg');btn.blur();if(btn.disabled)return;btn.disabled=true;btn.textContent='Saving…';
    msg.style.color='var(--muted)';msg.textContent='Saving… If Claude asks to allow saving, tap Allow.';
    try{const h=store.get('history',[]),i=h.findIndex(x=>x.ts===rec.ts);if(i>=0){h[i]=rec;store.set('history',h)}}catch(_){}
    try{await appendTo('runs',rec,300);rec.saved=true;try{const h=store.get('history',[]),i=h.findIndex(x=>x.ts===rec.ts);if(i>=0){h[i]=rec;store.set('history',h)}}catch(_){};msg.textContent='Saved to Coach\'s scoreboard!';msg.style.color='var(--good)';btn.textContent='Saved!';beep(880,.1)}
    catch(e){btn.disabled=false;btn.textContent='Try again';msg.innerHTML=`This game can't save here. Show Coach your score card:<br><span class="scard" id="scard"></span><br><button class="tbtn" id="copyCard">COPY SCORE CARD</button>`;
      $('#scard').textContent=cardText(rec);
      $('#copyCard').onclick=()=>{try{navigator.clipboard.writeText(cardText(rec)).then(()=>toast('COPIED!','good'),()=>selectCard())}catch(_){selectCard()}}}
  };
}
function selectCard(){const el=$('#scard');if(!el)return;const rg=document.createRange();rg.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg)}
function feedbackModal(back){
  const fb={ts:'',name:swName(),who:'',fun:0,easy:'',held:'',dizzy:'',note:''};
  openModal(`<span class="eyebrow">FEEDBACK</span><h2>Tell Coach what you think</h2>
  <form id="fbForm" class="fb">
    <p><b>Who is filling this in?</b></p>${choice('fWho',['Swimmer','Parent','Coach'])}
    <p><b>How fun was it?</b></p><div class="row stars" id="fFun">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-v="${n}" aria-label="${n} of 5">★</button>`).join('')}</div>
    <p><b>How hard was it?</b></p>${choice('fEasy',['Too easy','Just right','Too hard'])}
    <p><b>Did you practice holding your breath while playing?</b></p>${choice('fHeld',['Yes','Sometimes','No'])}
    <p><b>Did you feel dizzy at any point?</b></p>${choice('fDizzy',['No','A little','Yes'])}
    <p id="fDizzyMsg" class="warnbox" hidden>Thanks for telling us. Take breaks, breathe normally between rounds, and let Coach know.</p>
    <label for="fNote"><b>Anything else?</b></label>
    <textarea id="fNote" class="name-in" rows="3" maxlength="600" placeholder="What did you like? What was confusing?"></textarea>
    <div class="row"><button class="cbtn go" type="submit" id="fSend">Send feedback</button><button class="cbtn" type="button" id="fBack">Back</button></div>
    <p id="fMsg" style="color:var(--muted)"></p>
  </form>`);
  bindChoice('fWho',v=>fb.who=v);bindChoice('fEasy',v=>fb.easy=v);bindChoice('fHeld',v=>fb.held=v);bindChoice('fDizzy',v=>{fb.dizzy=v;$('#fDizzyMsg').hidden=v==='No'});
  card.querySelectorAll('.star').forEach(b=>b.onclick=()=>{fb.fun=+b.dataset.v;card.querySelectorAll('.star').forEach(o=>o.classList.toggle('on',+o.dataset.v<=fb.fun))});
  $('#fBack').onclick=()=>back?back():closeModal();
  $('#fbForm').addEventListener('submit',async e=>{e.preventDefault();fb.note=$('#fNote').value.trim();fb.ts=new Date().toISOString();const m=$('#fMsg');m.textContent='Sending…';
    const btn=$('#fSend');btn.blur();if(btn.disabled)return;btn.disabled=true;btn.textContent='Sending…';m.textContent='Sending… If Claude asks to allow saving, tap Allow.';
    try{await appendTo('feedback',fb,100);m.textContent='Thank you! Coach will read it.';m.style.color='var(--good)';btn.textContent='Sent!'}
    catch(_){btn.disabled=false;btn.textContent='Try again';m.textContent='This game can\'t send feedback from here. Please tell Coach in person!';m.style.color='var(--bad)'}});
}
/* ---------- Summary side tab ---------- */
let sumOpen=false;
const SUM_COLS=[['Date','ts'],['Swimmer','name'],['How far (m)','dist'],['Ending','end'],['Push %','push'],['Breath','breathNote'],['Pull at (m)','pullAt'],['Fixed 1st try','ff'],['Extra fixes','overFixes'],['Slow fixes','slowFixes'],['Little bubbles','bubbleBursts'],['Air left at roll (s)','rollAirLeft'],['Arms straight','armsStraight'],['Too-high push','highPush'],['Breath test (s)','breathTest'],['Air used (s)','airUsed'],['Held own breath','heldBreath'],['Dizzy','dizzy'],['Saved to Coach','saved']];
const ENDS={wall:'100 m!',rolled:'Rolled over',breathe:'Needed to breathe',late:'Too late to roll',underwater:'Breathed underwater',stood:'Stood up',stop:'Slowed down',air:'Out of air'};
const cellVal=(r,k)=>k==='ts'?(r.ts?new Date(r.ts).toLocaleString([],{dateStyle:'short',timeStyle:'short'}):''):k==='ff'?`${r.fixedFirst??''}/${r.fixes??''}`:k==='end'?(ENDS[r.end]||r.end||''):typeof r[k]==='boolean'?(r[k]?'yes':'no'):(r[k]??'');
async function loadRows(){
  const local=(store.get('history',[])||[]).map(x=>({...x}));let dbRows=[],fbs=[],scope='This device only';
  if(DB&&UID){
    try{
      if(OWNER){const [a,b]=await withTimeout(Promise.all([DB.collection('runs').get(),DB.collection('feedback').get()]),10000);
        a.docs.forEach(d=>(d.data().items||[]).forEach(x=>dbRows.push({...x,saved:true})));b.docs.forEach(d=>(d.data().items||[]).forEach(x=>fbs.push(x)));scope='Every saved round, all swimmers + this device';}
      else{const d=await withTimeout(DB.doc('runs/'+UID).get(),10000);if(d.exists)(d.data().items||[]).forEach(x=>dbRows.push({...x,saved:true}));scope='Your saved rounds + this device';}
    }catch(e){scope='This device only (could not reach saved scores)'}
  }
  const seen=new Set(dbRows.map(x=>x.ts+'|'+x.name));
  const rows=dbRows.concat(local.filter(x=>!seen.has(x.ts+'|'+x.name)).map(x=>({...x,saved:!!x.saved}))).sort((x,y)=>(y.ts||'')<(x.ts||'')?-1:1);
  fbs.sort((x,y)=>(y.ts||'')<(x.ts||'')?-1:1);
  return {rows,fbs,scope};
}
async function openSummary(){
  sumOpen=true;holdEnd();const pnl=$('#sumPanel');pnl.hidden=false;$('#sumTab').setAttribute('aria-expanded','true');
  $('#sumBody').innerHTML='<p>Loading…</p>';
  const {rows,fbs,scope}=await loadRows();
  const n=rows.length,best=n?Math.max(...rows.map(r=>+r.dist||0)):0,wins=rows.filter(r=>r.end==='wall').length,rolled=rows.filter(r=>r.end==='rolled').length,stood=rows.filter(r=>r.end==='stood').length;
  const ffN=rows.reduce((a,r)=>a+(+r.fixedFirst||0),0),ffD=rows.reduce((a,r)=>a+(+r.fixes||0),0);
  const tile=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  $('#sumBody').innerHTML=`<p class="sum-scope">${esc(scope)}</p>
    <div class="stats sum-stats">${tile(store.get('breathCtrl',false)?'★':'–','BREATH CONTROL')}${tile(store.get('mastered',false)?'★':'–','GLIDE (100 M)')}${tile(store.get('breathCtrl',false)&&store.get('mastered',false)?'YES':'NOT YET','LEVEL 2 UNLOCKED')}${tile(n,'ROUNDS')}${tile(best+' m','BEST')}${tile(wins,'REACHED 100 M')}${tile(rolled+' / '+stood,'ROLLED / STOOD UP')}${tile(ffD?Math.round(ffN/ffD*100)+'%':'–','FIXED FIRST TRY')}${tile(n?(rows.reduce((a,r)=>a+(+r.overFixes||0),0)/n).toFixed(1):'–','EXTRA FIXES / ROUND')}</div>
    ${(()=>{const bt=store.get('breathTests',[]);return bt.length?`<h3 class="sum-h">BREATH TESTS</h3><p>${bt.slice(-8).reverse().map(x=>esc(new Date(x.ts).toLocaleDateString())+': '+x.secs+' s'+(x.full?' ★':'')).join(' · ')}</p>`:''})()}<h3 class="sum-h">SCORES</h3>${n?'<div class="tablewrap" id="sumTable"></div>':'<p>No rounds yet. Finish a round and it shows up here.</p>'}
    ${n?'<div class="row"><button class="cbtn" id="sumCsv">Copy scores as CSV</button></div>':''}
    ${OWNER?`<h3 class="sum-h">FEEDBACK</h3>${fbs.length?'<div class="tablewrap" id="fbTable"></div>':'<p>No feedback yet.</p>'}`:''}`;
  if(n){const t=document.createElement('table');const h=t.insertRow();SUM_COLS.forEach(([l])=>{const th=document.createElement('th');th.textContent=l;h.appendChild(th)});
    rows.forEach(r=>{const tr=t.insertRow();SUM_COLS.forEach(([,k])=>{tr.insertCell().textContent=cellVal(r,k)})});$('#sumTable').appendChild(t);
    $('#sumCsv').onclick=()=>{const keys=['ts','name','dist','end','coins','push','breathStart','breathNote','pullAt','fixedFirst','fixes','overFixes','slowFixes','bubbleBursts','rollOvers','rollAirLeft','glideMilestone','breathControl','armsStraight','highPush','breathTest','airUsed','heldBreath','dizzy','saved'];
      const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[keys.join(',')].concat(rows.map(r=>keys.map(k=>q(r[k])).join(','))).join('\n');
      try{navigator.clipboard.writeText(csv).then(()=>toast('CSV COPIED','good'),()=>toast('COPY BLOCKED','bad'))}catch(_){toast('COPY BLOCKED','bad')}}}
  if(OWNER&&fbs.length){const cs=[['Date','ts'],['Name','name'],['Who','who'],['Fun (1-5)','fun'],['How hard','easy'],['Held breath','held'],['Dizzy','dizzy'],['Note','note']];
    const t=document.createElement('table');const h=t.insertRow();cs.forEach(([l])=>{const th=document.createElement('th');th.textContent=l;h.appendChild(th)});
    fbs.forEach(r=>{const tr=t.insertRow();cs.forEach(([,k])=>{tr.insertCell().textContent=cellVal(r,k)})});$('#fbTable').appendChild(t)}
}
function closeSummary(){sumOpen=false;$('#sumPanel').hidden=true;$('#sumTab').setAttribute('aria-expanded','false')}

/* ---------- controls: keyboard + toggles ---------- */
const keymap=Object.fromEntries(ACTIONS.map(a=>[a.key,a.id]));
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.closest&&e.target.closest('.wheel')))return;
  if(e.code==='Space'){e.preventDefault();if(bt&&bt.key){if(!e.repeat)bt.key();return}if(!e.repeat)holdStart();return}
  if(e.repeat||!modal.hidden)return;const a=keymap[e.key.toLowerCase()];if(a){act(a);const b=$('#b_'+a);b.classList.add('down');setTimeout(()=>b.classList.remove('down'),120)}
});
addEventListener('keyup',e=>{if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;if(e.code==='Space'){if(modal.hidden)e.preventDefault();holdEnd()}});
const hb=$('#hintsBtn'),sb=$('#soundBtn');hb.setAttribute('aria-pressed',hints);sb.setAttribute('aria-pressed',soundOn);
hb.onclick=()=>{hints=!hints;store.set('hints',hints);hb.setAttribute('aria-pressed',hints);lastCoach='';coach()};
sb.onclick=()=>{soundOn=!soundOn;store.set('sound',soundOn);sb.setAttribute('aria-pressed',soundOn)};
$('#breathBtn').onclick=introModal;
$('#guideBtn').onclick=()=>{if(R&&R.phase==='end')guideModal(true);else guideModal(false)};
['armH'].forEach(id=>$('#'+id).addEventListener('input',e=>{if(!R||R.phase==='end')return;const was=postErr(R)===0;R[id]=+e.target.value;if(Math.abs(R[id])<.1){R[id]=0}armLabel();if(!was&&postErr(R)===0){toast('STRAIGHT LINE!','good');beep(880,.08)}}));
$('#needBreath').addEventListener('click',()=>{if(!R||R.phase==='end'||paused)return;holding=false;holdBtn.classList.remove('down');R.exhaling=false;R.breathHold=false;toast('GOOD CHOICE. BREATHE!','good');endRun('breathe')});
$('#sumTab').onclick=()=>sumOpen?closeSummary():openSummary();
$('#sumClose').onclick=closeSummary;
$('#swimmerBtn').onclick=()=>pickModal(false);
$('#fbBtn').onclick=()=>feedbackModal(null);
$('#restartBtn').onclick=()=>{newRun();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)holdEnd()});

/* ---------- loop ---------- */
newRun();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused&&!sumOpen)update(dt);draw(now/1000);hud();requestAnimationFrame(loop)}
(document.fonts?document.fonts.load('8px Silkscreen'):Promise.resolve()).catch(()=>{}).finally(()=>{requestAnimationFrame(loop);setTag();if(store.get('look',null))introModal();else pickModal(true)});
})();
</script>

</body></html>
